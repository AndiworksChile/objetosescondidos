<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Objetos Perdidos · Fichas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       VARIABLES DE MARCA
       ============================================================ */
    :root {
      --midnight:   #17243D;
      --midnight-2: #1e2f4d;
      --purple:     #563477;
      --swamp:      #425D50;
      --gold:       #D7B878;
      --lavender:   #C7B3E5;
      --parchment:  #F4EBDD;

      --text-main:  #e8e3d8;
      --text-soft:  #b9b6c9;

      --font-heading: 'Cinzel', serif;
      --font-body:    'Nunito Sans', system-ui, sans-serif;

      --header-h: 80px;
      --stage-size: clamp(150px, 36vh, 220px);
      --pad-bottom: 24px;
      --content-reserve: 150px;   /* alto guardado para el texto y los botones */
      --app-h: 100vh;
    }
    @supports (height: 100dvh) {
      :root { --app-h: 100dvh; }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* La página nunca se desplaza en vertical: todo vive dentro de la ventana */
    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: pan-x pinch-zoom;
    }
    html { background: var(--midnight-2); }

    body {
      position: fixed;
      inset: 0;
      color: var(--text-main);
      font-family: var(--font-body);
      cursor: none;               /* ocultamos el cursor nativo en desktop */
    }
    /* ...pero volvemos a mostrarlo en touch */
    @media (hover: none) {
      body { cursor: auto; }
    }

    /* ============================================================
       HALO DEL MOUSE
       ============================================================ */
    .cursor-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 40;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle,
        rgba(215,184,120,0.18) 0%,
        rgba(199,179,229,0.10) 35%,
        transparent 70%);
      filter: blur(6px);
      transition: opacity 0.35s ease, transform 0.18s ease-out, background 0.4s ease;
      mix-blend-mode: screen;
      will-change: transform, opacity;
    }
    .cursor-glow.hidden { opacity: 0; }
    .cursor-glow.hot {
      /* sobre una card */
      background: radial-gradient(circle,
        rgba(215,184,120,0.32) 0%,
        rgba(199,179,229,0.18) 35%,
        transparent 70%);
    }
    .cursor-glow.pulse {
      /* feedback al hacer clic */
      animation: cursorPulse 0.5s ease-out;
    }
    @keyframes cursorPulse {
      0%   { transform: translate(-50%, -50%) scale(1); }
      40%  { transform: translate(-50%, -50%) scale(1.6); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    /* Punto central del cursor */
    .cursor-dot {
      position: fixed;
      top: 0;
      left: 0;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 10px rgba(215,184,120,0.8);
      pointer-events: none;
      z-index: 41;
      transform: translate(-50%, -50%);
      transition: opacity 0.35s ease;
      will-change: transform;
    }
    .cursor-dot.hidden { opacity: 0; }

    /* ============================================================
       FONDO PARALLAX
       ============================================================ */
    .sky {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      height: 100lvh;             /* el fondo no cambia con el teclado ni las barras del navegador */
      background:
        radial-gradient(circle at 50% 0%, rgba(86,52,119,0.35) 0%, transparent 55%),
        radial-gradient(circle at 50% 100%, rgba(66,93,80,0.18) 0%, transparent 60%),
        linear-gradient(180deg, var(--midnight) 0%, var(--midnight-2) 100%);
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .sky-layer {
      position: absolute;
      inset: -140px;              /* mayor que el desplazamiento máximo: nunca se ve el borde */
      transform: translate(var(--px, 0px), var(--py, 0px));
      transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }
    .sky-layer svg { width: 100%; height: 100%; display: block; }
    /* En el teléfono el fondo responde al instante a la inclinación */
    @media (hover: none) {
      .sky-layer { transition: none; }
    }

    .sky-far   { opacity: 0.35; }
    .sky-mid   { opacity: 0.55; }
    .sky-near  { opacity: 0.78; }

    /* Estrellas: ahora con transición para que se iluminen al click */
    .star {
      transition: filter 0.25s ease, transform 0.25s ease, opacity 0.25s ease;
      transform-box: fill-box;
      transform-origin: center;
    }
    .star-twinkle {
      animation: twinkle 7s ease-in-out infinite;
    }
    .star-twinkle:nth-child(2n) { animation-duration: 9s; animation-delay: -2s; }
    .star-twinkle:nth-child(3n) { animation-duration: 11s; animation-delay: -4s; }
    .star-twinkle:nth-child(5n) { animation-duration: 13s; animation-delay: -6s; }
    @keyframes twinkle {
      0%, 100% { opacity: 0.35; }
      50%      { opacity: 0.95; }
    }

    /* Estrella "iluminada" por el click */
    .star.lit {
      filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 14px var(--gold));
      transform: scale(1.9);
    }

    .sky-halo {
      position: absolute;
      top: 15%;
      left: 50%;
      transform: translate(calc(-50% + var(--px, 0px)), var(--py, 0px));
      width: 900px;
      height: 900px;
      border-radius: 50%;
      background: radial-gradient(circle,
        rgba(215,184,120,0.10) 0%,
        rgba(215,184,120,0.04) 30%,
        transparent 65%);
      pointer-events: none;
      filter: blur(10px);
    }

    /* ============================================================
       HEADER
       ============================================================ */
    .brand-header {
      position: fixed;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: none;
      user-select: none;
      opacity: 0;
      animation: fadeDown 1s ease 0.2s forwards;
    }

    .brand-mark { width: 30px; height: 30px; flex-shrink: 0; }
    .brand-name {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 4px;
      text-transform: uppercase;
      white-space: nowrap;
      color: var(--gold);
      text-shadow: 0 0 18px rgba(215,184,120,0.25);
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translate(-50%, -8px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }

    /* Ícono de Instagram */
    .social-link {
      position: fixed;
      bottom: 6px;
      left: 50%;
      margin-left: -22px;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      color: var(--lavender);
      cursor: pointer;
      opacity: 0;
      animation: fadeIn 1s ease 0.4s forwards;
      transition: color 0.2s ease;
    }
    .social-link:hover { color: var(--gold); }
    .social-link:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: -4px;
      border-radius: 10px;
    }
    .social-link svg { width: 22px; height: 22px; }

    /* ============================================================
       CONTROLES
       ============================================================ */
    .top-controls {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 100;
      display: flex;
      gap: 10px;
      opacity: 0;
      animation: fadeIn 1s ease 0.4s forwards;
    }
    .top-controls[hidden] { display: none; }
    @keyframes fadeIn { to { opacity: 1; } }

    .ctrl-btn {
      padding: 10px 18px;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--parchment);
      background: rgba(86,52,119,0.35);
      border: 1px solid rgba(199,179,229,0.35);
      border-radius: 8px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      font-family: var(--font-body);
      font-weight: 600;
    }
    .ctrl-btn:hover {
      background: rgba(86,52,119,0.6);
      border-color: var(--gold);
      color: #fff;
      box-shadow: 0 0 20px rgba(215,184,120,0.2);
    }
    .ctrl-btn:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    /* ============================================================
       GRID DE CARDS — CENTRADO REAL
       ============================================================ */
    .cards-grid {
      position: relative;
      z-index: 5;
      display: flex;
      gap: 3.5vw;
      justify-content: center;
      width: 100%;
      height: var(--app-h);              /* ocupa toda la ventana */
      padding: var(--header-h) 24px var(--pad-bottom);/* margen para el header */
      overflow: hidden;
    }

    /* ============================================================
       CARD
       ============================================================ */
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      /* El modelo tiene una posición fija: el espacio del texto queda siempre
         reservado, así activar o desactivar no mueve nada en la página. */
      padding-top: max(0px, calc((var(--app-h) - var(--header-h) - var(--pad-bottom)
                   - var(--stage-size) - 10px - var(--content-reserve)) / 2));
      cursor: pointer;
      position: relative;
      width: 320px;
      pointer-events: none;               /* solo el modelo y los botones reciben clics */
      opacity: 0;
      transform: translateY(14px);
      animation: cardIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .card:nth-child(1) { animation-delay: 0.55s; }
    .card:nth-child(2) { animation-delay: 0.70s; }
    .card.selected { z-index: 2; }
    .card-inactive { cursor: inherit; }
    .card-inactive:hover .stage-content { transform: none; }
    .card-inactive:hover .card-label { color: var(--text-soft); }

    @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }

    .card-stage {
      position: relative;
      flex: none;
      width: var(--stage-size);
      height: var(--stage-size);
      pointer-events: auto;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    /* Contenido bajo el modelo: solo aparece y desaparece, sin mover el modelo */
    .card-content {
      width: 100%;
      visibility: hidden;
      pointer-events: none;
      transition: visibility 0s linear 0.5s;
    }
    .card.selected .card-content {
      visibility: visible;
      transition-delay: 0s;
    }

    .card-content-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .card-title {
      width: 100%;
      margin-top: 10px;
      text-align: center;
      font-family: var(--font-heading);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: 0.5px;
      color: var(--text-soft);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.5s ease, transform 0.5s ease, color 0.4s ease;
      pointer-events: none;
      user-select: none;
    }
    .card.selected .card-title {
      opacity: 1;
      transform: translateY(0);
      color: var(--glow-color);
      text-shadow: 0 0 20px color-mix(in srgb, var(--glow-color) 40%, transparent);
    }

    .card-desc {
      width: 100%;
      text-align: center;
      font-size: 13px;
      line-height: 1.55;
      color: var(--text-soft);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.5s ease 0.06s, transform 0.5s ease 0.06s, color 0.4s ease;
      pointer-events: none;
      user-select: none;
    }
    .card.selected .card-desc {
      opacity: 1;
      transform: translateY(0);
      color: var(--parchment);
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      pointer-events: none;
      padding: 4px;
    }

    .card-btn {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-soft);
      background: rgba(244,235,221,0.04);
      border: 1px solid rgba(199,179,229,0.18);
      border-radius: 999px;
      padding: 6px 14px;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      opacity: 0;
      transform: translateY(6px);
    }
    .card.selected .card-btn {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      color: var(--glow-color);
      border-color: color-mix(in srgb, var(--glow-color) 45%, transparent);
      background: color-mix(in srgb, var(--glow-color) 10%, transparent);
      transition: opacity 0.4s ease, transform 0.4s ease,
                  background 0.15s ease, color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .card.selected .card-btn:nth-child(1) { transition-delay: 0.30s, 0.30s, 0s, 0s, 0s, 0s; }
    .card.selected .card-btn:nth-child(2) { transition-delay: 0.40s, 0.40s, 0s, 0s, 0s, 0s; }

    .card.selected .card-btn:hover {
      background: color-mix(in srgb, var(--glow-color) 22%, transparent);
      border-color: color-mix(in srgb, var(--glow-color) 75%, transparent);
      color: #fff;
      box-shadow: 0 0 16px color-mix(in srgb, var(--glow-color) 35%, transparent);
    }
    .card-btn:active { transform: scale(0.96); }
    .card-btn:focus-visible {
      outline: 2px solid var(--glow-color);
      outline-offset: 2px;
    }

    /* Stage 3D interno */
    .stage-content {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      transition: transform 0.7s cubic-bezier(0.4, 0.0, 0.2, 1);
      will-change: transform;
    }
    .card:hover .stage-content { transform: translateY(-4px); }
    .card.selected .stage-content { transform: translateY(-6px); }

    .slot {
      position: absolute;
      inset: 0;
      opacity: 1;
      transition: opacity 0.4s ease;
    }
    .slot.hidden { opacity: 0; pointer-events: none; }
    .slot canvas { display: block; }

    /* Dibujo de reemplazo si el dispositivo no puede mostrar el modelo 3D */
    .model-fallback {
      display: block;
      width: 62%;
      height: 62%;
      margin: 12% auto 0;
      color: var(--text-soft);
      transition: color 0.4s ease;
    }
    .card.selected .model-fallback { color: var(--glow-color); }

    .card-shadow {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translate(-50%, var(--shadow-y, 190px)) scale(var(--shadow-scale, 1));
      width: 90px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(6,10,20,0.65) 0%, transparent 70%);
      filter: blur(3px);
      pointer-events: none;
      opacity: 0.6;
      transition: opacity 0.35s ease;
      z-index: 0;
    }
    .card.selected .card-shadow { opacity: 0.5; }

    .card-glow {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translate(-50%, calc(var(--shadow-y, 190px) + var(--glow-offset, 0px))) scale(1.1);
      width: 100px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(ellipse, var(--glow-color) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.5s ease;
      filter: blur(6px);
      pointer-events: none;
      z-index: 1;
    }
    .card.selected .card-glow {
      opacity: 0.7;
      animation: breathe 3.4s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { filter: blur(6px); opacity: 0.65; }
      50%      { filter: blur(8px); opacity: 0.85; }
    }

    .card-flash {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff 0%, var(--glow-color) 40%, transparent 70%);
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      pointer-events: none;
      filter: blur(2px);
      z-index: 2;
    }
    .card.flash .card-flash { animation: flashBurst 0.9s ease-out forwards; }

    @keyframes flashBurst {
      0%   { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
      25%  { opacity: 0.95; }
      100% { transform: translate(-50%, -50%) scale(4); opacity: 0; }
    }

    /* Label debajo del modelo */
    .card-label {
      position: relative;
      margin-top: -6px;                    /* justo debajo de la sombra del modelo */
      min-height: 16px;
      color: var(--text-soft);
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      transition: color 0.35s ease, text-shadow 0.35s ease;
      user-select: none;
      pointer-events: auto;
      z-index: 3;
      white-space: nowrap;
    }
    .card:hover .card-label { color: var(--lavender); }
    .card.selected .card-label {
      color: var(--glow-color);
      text-shadow: 0 0 14px var(--glow-color);
    }

    /* ============================================================
       CÓDIGO
       ============================================================ */
    .code-panel {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, calc(-46% - var(--kb-shift, 0px)));
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .code-panel.open {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, calc(-50% - var(--kb-shift, 0px)));
    }

    .code-hint {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 10.5px;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--lavender);
      text-shadow: 0 1px 6px rgba(0,0,0,0.7);
      user-select: none;
    }

    .code-boxes { display: flex; gap: 8px; }
    .code-box {
      width: 34px;
      height: 42px;
      font-size: 20px;
      font-weight: 600;
      color: var(--parchment);
      background: rgba(23, 36, 61, 0.92);
      border: 1px solid rgba(199,179,229,0.35);
      border-radius: 8px;
      outline: none;
      text-align: center;
      font-family: var(--font-body);
      caret-color: var(--gold);
      box-shadow: 0 4px 14px rgba(0,0,0,0.45);
      transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }
    .code-box:focus {
      border-color: var(--gold);
      background: rgba(30, 47, 77, 0.98);
      box-shadow: 0 0 12px rgba(215,184,120,0.35);
    }
    .code-box.error {
      border-color: #d96a6a;
      background: rgba(70, 20, 30, 0.9);
    }

    .code-msg {
      font-family: var(--font-body);
      font-size: 11px;
      color: #e08a8a;
      letter-spacing: 0.5px;
      height: 14px;
      opacity: 0;
      transition: opacity 0.25s ease;
      text-shadow: 0 1px 3px rgba(0,0,0,0.7);
    }
    .code-msg.show { opacity: 1; }

    @keyframes shakeLock {
      0%, 100% { transform: translateX(0); }
      15% { transform: translateX(-8px) rotate(-1.5deg); }
      30% { transform: translateX(7px) rotate(1.5deg); }
      45% { transform: translateX(-6px) rotate(-1deg); }
      60% { transform: translateX(5px) rotate(1deg); }
      75% { transform: translateX(-3px); }
      90% { transform: translateX(2px); }
    }
    .code-panel.shake .code-boxes,
    .code-panel.shake .code-hint {
      animation: shakeLock 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }

    .code-panel.fade-out {
      opacity: 0;
      transform: translate(-50%, calc(-60% - var(--kb-shift, 0px))) scale(0.9);
    }

    /* ============================================================
       REPRODUCTOR DE VIDEO
       ============================================================ */
    .video-modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(10, 16, 30, 0.92);
      backdrop-filter: blur(6px);
      cursor: default;                    /* el cursor propio queda detrás del modal */
    }
    .video-modal[hidden] { display: none; }

    .video-player {
      position: relative;
      display: flex;
      flex-direction: column;
      width: min(960px, 100%);
      background: #000;
      border: 1px solid rgba(199,179,229,0.25);
      border-radius: 12px;
      overflow: hidden;
    }
    .video-player video {
      display: block;
      width: 100%;
      max-height: calc(100vh - 124px);
      max-height: calc(100dvh - 124px);
      min-height: 180px;
      background: #000;
      cursor: pointer;
    }
    /* Reglas separadas: un navegador descarta la regla completa si no reconoce un selector */
    .video-player:fullscreen {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 0;
    }
    .video-player:-webkit-full-screen {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 0;
    }
    .video-player:fullscreen video {
      flex: 1;
      min-height: 0;
      max-height: none;
    }
    .video-player:-webkit-full-screen video {
      flex: 1;
      min-height: 0;
      max-height: none;
    }

    .video-btn.video-close {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
      background: rgba(23, 36, 61, 0.85);
    }

    .video-msg {
      position: absolute;
      top: 40%;
      left: 16px;
      right: 16px;
      text-align: center;
      font-size: 14px;
      color: var(--parchment);
    }
    .video-msg[hidden] { display: none; }

    .video-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px 12px;
      background: var(--midnight);
    }
    .video-seek {
      width: 100%;
      height: 20px;
      accent-color: var(--gold);
      cursor: pointer;
    }
    .video-buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .video-time {
      margin-right: auto;
      min-width: 84px;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: var(--text-soft);
    }
    .video-spacer { margin-left: auto; min-width: 84px; display: flex; justify-content: flex-end; }

    .video-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      height: 44px;
      padding: 0 8px;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 13px;
      color: var(--parchment);
      background: rgba(244,235,221,0.06);
      border: 1px solid rgba(199,179,229,0.3);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    @media (max-width: 420px) {
      .video-buttons { flex-wrap: wrap; }
      .video-time { flex: 0 0 100%; margin-right: 0; text-align: center; }
      .video-spacer { min-width: 0; }
      .video-player video {
        max-height: calc(100vh - 176px);
        max-height: calc(100dvh - 176px);
      }
    }
    .video-btn:hover { background: rgba(86,52,119,0.6); border-color: var(--gold); }
    .video-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .video-btn svg { width: 20px; height: 20px; fill: currentColor; }
    .video-btn .icon-play { display: none; }
    .video-btn.paused .icon-play { display: block; }
    .video-btn.paused .icon-pause { display: none; }

    /* ============================================================
       PARTÍCULAS
       ============================================================ */
    .magic-particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 45;
      overflow: hidden;
    }
    .particle, .sparkle {
      position: absolute;
      pointer-events: none;
      will-change: transform, opacity;
    }
    .particle { border-radius: 50%; }

    /* ============================================================
       ACCESIBILIDAD
       ============================================================ */
    @media (prefers-reduced-motion: reduce) {
      .star-twinkle,
      .card,
      .brand-header,
      .social-link,
      .top-controls { animation: none !important; opacity: 1 !important; transform: none !important; }
      .card.selected .card-glow { animation: none; }
      .stage-content,
      .sky-layer { transition: none; }
      .sky-layer { transform: none !important; }
      .cursor-glow { display: none; }
      .cursor-dot { display: none; }
      body { cursor: auto; }
    }

    @media (max-width: 900px) {
      body { cursor: auto; }
      .cursor-glow, .cursor-dot { display: none; }
      .brand-name { font-size: 13px; letter-spacing: 3px; }
    }

    /* Pantallas bajas (teléfono en horizontal) */
    @media (max-height: 520px) {
      :root {
        --header-h: 60px;
        --stage-size: clamp(110px, 30vh, 150px);
        --pad-bottom: 12px;
        --content-reserve: 144px;
      }
      .brand-header { top: 14px; }
      /* Con poca altura, el ícono pasa a la esquina para no tocar el contenido */
      .social-link { left: auto; right: 8px; margin-left: 0; }
    }

    /* Teléfono: carrusel horizontal con el modelo activo al centro */
    @media (max-width: 700px) {
      :root {
        --header-h: 64px;
        --stage-size: clamp(150px, 36vh, 240px);
        --pad-bottom: 16px;
        --content-reserve: 184px;
        --card-w: min(calc(100vw - 40px), 380px);
        --side-space: calc((100vw - var(--card-w)) / 2);
      }
      .cards-grid {
        justify-content: flex-start;
        gap: 0;
        padding: var(--header-h) 0 var(--pad-bottom) var(--side-space);
        overflow-x: auto;
        overflow-y: hidden;
        overscroll-behavior-x: contain;
        scroll-snap-type: x mandatory;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .cards-grid::-webkit-scrollbar { display: none; }
      .cards-grid::after {               /* permite centrar también la última card */
        content: '';
        flex: 0 0 var(--side-space);
      }
      .card {
        flex: 0 0 var(--card-w);
        scroll-snap-align: center;
        scroll-snap-stop: always;
      }
      /* Acerca la card vecina para que su modelo asome por el borde */
      .card + .card { margin-left: calc(50vw - 5px - var(--card-w)); }
      .card.off-center .card-stage { opacity: 0.8; transform: scale(0.88); }
      .card.off-center .card-label { opacity: 0; }
      /* Con una card abierta, el vecino se atenúa para no competir con el texto */
      .cards-grid:has(.card.selected) .card.off-center .card-stage { opacity: 0.35; }
      .card-content-inner {
        width: min(100%, calc(100vw - 104px));
        margin-inline: auto;
      }
    }
    @media (max-width: 700px) and (max-height: 520px) {
      :root {
        --header-h: 52px;
        --stage-size: clamp(110px, 30vh, 150px);
        --pad-bottom: 12px;
        --content-reserve: 130px;
      }
    }
  </style>

  <script type="module">
    import * as THREE from './vendor/three.module.js';

    /* ============================================================
       DATOS DE LAS FICHAS
       ============================================================ */
    /* La clave no se guarda en el código: solo su huella, y la ruta del video se
       obtiene a partir de la clave. Con 4 dígitos esto oculta, pero no es seguridad real. */
    function hashCode(str) {
      let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
      for (let i = 0; i < str.length; i++) {
        const c = str.charCodeAt(i);
        h1 = Math.imul(h1 ^ c, 2654435761);
        h2 = Math.imul(h2 ^ c, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
    }

    const CARDS = [
      { id:'hiedra',    name:'Hiedra Eterna', shape:'brilliant', color:'#66bb6a', codeHash:'ae2204ccf4459',
        title:'Arma tu Hiedra Eterna',
        desc:'Un pequeño kit botánico para descubrir, crear y coleccionar. Cada pieza está pensada para armar algo tuyo.',
        buttons: [
          { label:'Tutorial', video:true },
          { label:'Instagram', href:'https://www.instagram.com/objetos.escondidos/' },
        ] },
      { id:'misterio',  name:'Próximamente', color:'#5a556b', inactive:true },
    ];

    /* ============================================================
       GEOMETRÍA DE GEMA
       ============================================================ */
    function ring(N, y, radiusFn) {
      const arr = [];
      for (let i = 0; i < N; i++) {
        const a = (i / N) * Math.PI * 2;
        const r = radiusFn(a);
        arr.push(new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r));
      }
      return arr;
    }

    function buildFromRings(rings, tableCenter, tipCenter, N) {
      const positions = [];
      const push = (v) => positions.push(v.x, v.y, v.z);
      for (let i = 0; i < N; i++) {
        const a = rings[0][i], b = rings[0][(i + 1) % N];
        push(tableCenter); push(b); push(a);
      }
      for (let r = 0; r < rings.length - 1; r++) {
        const top = rings[r], bot = rings[r + 1];
        for (let i = 0; i < N; i++) {
          const i2 = (i + 1) % N;
          const a = top[i], b = top[i2], c = bot[i], d = bot[i2];
          push(a); push(b); push(c);
          push(b); push(d); push(c);
        }
      }
      const last = rings[rings.length - 1];
      for (let i = 0; i < N; i++) {
        const a = last[i], b = last[(i + 1) % N];
        push(tipCenter); push(a); push(b);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.computeVertexNormals();
      return geo;
    }

    const gemShapes = {
      brilliant() {
        const N = 8;
        return buildFromRings([
          ring(N, 0.55, () => 0.85),
          ring(N, 0.05, () => 1.0),
          ring(N, -0.55, () => 0.55),
        ], new THREE.Vector3(0, 1.0, 0), new THREE.Vector3(0, -1.1, 0), N);
      },
      emerald() {
        const N = 12;
        const rf = (a) => {
          const ax = 1.15, ay = 0.8, c = Math.cos(a), s = Math.sin(a);
          return Math.min(1 / Math.max(Math.abs(c)/ax, Math.abs(s)/ay), 1.0);
        };
        return buildFromRings([
          ring(N, 0.55, a => rf(a) * 0.9),
          ring(N, 0.05, a => rf(a)),
          ring(N, -0.55, a => rf(a) * 0.65),
        ], new THREE.Vector3(0, 1.0, 0), new THREE.Vector3(0, -1.1, 0), N);
      },
      marquise() {
        const N = 10;
        const rf = (a) => {
          const c = Math.cos(a), s = Math.sin(a);
          return 1 / Math.sqrt((c/1.35)**2 + (s/0.6)**2);
        };
        return buildFromRings([
          ring(N, 0.55, a => rf(a) * 0.9),
          ring(N, 0.05, a => rf(a)),
          ring(N, -0.55, a => rf(a) * 0.6),
        ], new THREE.Vector3(0, 1.0, 0), new THREE.Vector3(0, -1.1, 0), N);
      },
      pear() {
        const N = 10;
        const rf = (a) => {
          const c = Math.cos(a), s = Math.sin(a);
          return 1 / Math.sqrt((c/0.9)**2 + (s/1.1)**2);
        };
        return buildFromRings([
          ring(N, 0.5, a => rf(a) * 0.9),
          ring(N, 0.0, a => rf(a)),
          ring(N, -0.5, a => rf(a) * 0.6),
        ], new THREE.Vector3(0, 1.0, 0), new THREE.Vector3(0, -1.1, 0.15), N);
      },
    };
    const geometryCache = {};
    function getGemGeometry(shape) {
      if (!geometryCache[shape]) geometryCache[shape] = gemShapes[shape]();
      return geometryCache[shape];
    }

    /* ============================================================
       SETUP BASE DE THREE
       ============================================================ */
    const GRAY_BASE = new THREE.Color(0x5a556b);
    const GOLD = new THREE.Color(0xD7B878);

    function setupBase(container, camPos, fov, lookAt) {
      const w = container.clientWidth;
      const h = container.clientHeight;
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(fov, w / h, 0.1, 100);
      camera.position.set(camPos[0], camPos[1], camPos[2]);
      camera.lookAt(lookAt[0], lookAt[1], lookAt[2]);

      const key = new THREE.DirectionalLight(0xfff2d8, 2.0);
      key.position.set(3, 5, 4);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0xb9a7dd, 1.3);
      rim.position.set(-4, -2, -3);
      scene.add(rim);
      scene.add(new THREE.AmbientLight(0xffffff, 0.7));

      return { renderer, scene, camera };
    }

    /* ============================================================
       SHADOW MANAGER
       ============================================================ */
    const SHADOW_GAP_PX = 5;

    class ShadowManager {
      constructor(slotEl, getObjFn, camera) {
        this.slotEl = slotEl;
        this.stageEl = slotEl.closest('.card-stage');
        this.getObjFn = getObjFn;
        this.camera = camera;
      }
      update() {
        const obj = this.getObjFn();
        if (!obj || this.slotEl.classList.contains('hidden')) return;
        const box = new THREE.Box3().setFromObject(obj);
        const center = new THREE.Vector3();
        box.getCenter(center);
        const bottomWorld = new THREE.Vector3(center.x, box.min.y, center.z);
        const ndc = bottomWorld.clone().project(this.camera);
        const basePxY = (1 - ndc.y) * 0.5 * this.stageEl.clientHeight;
        this.stageEl.style.setProperty('--shadow-y', `${basePxY + SHADOW_GAP_PX}px`);

        const size = box.getSize(new THREE.Vector3());
        const scale = Math.max(0.55, Math.min(1.3, size.x / 1.3));
        this.stageEl.style.setProperty('--shadow-scale', `${scale}`);
      }
    }

    /* ============================================================
       BASE VIEWER
       ============================================================ */
    const MODEL_BASE_OFFSET = 0.35;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    class BaseViewer {
      constructor(container, baseColor, index) {
        this.container = container;
        this.baseColor = new THREE.Color(baseColor);
        this.currentColor = GRAY_BASE.clone();
        this.isHovered = false;
        this.isSelected = false;
        this.isUnlocked = false;

        const seed = (index + 1) * 1.37;
        this.levitAmp   = reduceMotion ? 0 : 0.015 + (index * 0.003);
        this.levitSpeed = 0.9 + (index * 0.15);
        this.levitPhase = seed * Math.PI;
        this.rotY = 0;
        this.currentRotationSpeed = 0;
        this.flashTimer = 0;
        this.flashDuration = 0.9;
        this.clock = new THREE.Clock();
      }

      setHovered(v) { this.isHovered = v; }
      setSelected(v, flash = true) {
        const was = this.isSelected;
        this.isSelected = v;
        if (v && !was && flash) this.flashTimer = this.flashDuration;
      }
      setUnlocked(v) { this.isUnlocked = v; }

      applyColor(dt, targetMaterial, activeEmissive = 0.28, idleEmissive = 0.15) {
        const colored = this.isUnlocked;
        const awake = this.isHovered || this.isSelected;
        const targetColor = colored ? this.baseColor : GRAY_BASE;
        this.currentColor.lerp(targetColor, Math.min(1, dt * 6));
        targetMaterial.color.copy(this.currentColor);

        let flashBoost = 0;
        if (this.flashTimer > 0) {
          this.flashTimer = Math.max(0, this.flashTimer - dt);
          const p = 1 - (this.flashTimer / this.flashDuration);
          flashBoost = Math.sin(p * Math.PI) * 1.8;
        }
        const baseEm = colored
          ? this.baseColor.clone().multiplyScalar(this.isSelected ? activeEmissive : idleEmissive)
          : (awake ? new THREE.Color(0.05, 0.04, 0.08) : new THREE.Color(0x000000));
        const emTarget = baseEm.clone().add(new THREE.Color(1,1,1).multiplyScalar(flashBoost));
        targetMaterial.emissive.lerp(emTarget, Math.min(1, dt * 10));

        const targetOpacity = (awake || colored) ? 0.95 : 0.42;
        targetMaterial.opacity += (targetOpacity - targetMaterial.opacity) * Math.min(1, dt * 8);
      }

      applyLevit(obj3D, dt) {
        const t = performance.now() * 0.001;
        const levitY = Math.sin(t * this.levitSpeed + this.levitPhase) * this.levitAmp;
        const targetY = -MODEL_BASE_OFFSET + levitY;
        obj3D.position.y += (targetY - obj3D.position.y) * Math.min(1, dt * 8);
      }
    }

    class QuestionViewer extends BaseViewer {
      constructor(container, colorHex, index) {
        super(container, colorHex, index);

        const { renderer, scene, camera } = setupBase(
          container, [0, 0.05, 3.8], 45, [0, -0.35, 0]
        );
        this.renderer = renderer; this.scene = scene; this.camera = camera;

        this.material = new THREE.MeshPhongMaterial({
          color: GRAY_BASE.clone(), shininess: 60, specular: 0x555555,
          emissive: new THREE.Color(0x000000), flatShading: true,
        });

        const R = 0.16;
        const center = new THREE.Vector2(0, 0.52);
        const points = [];
        for (let a = 170; a >= -60; a -= 23) {
          const rad = THREE.MathUtils.degToRad(a);
          points.push(new THREE.Vector3(
            center.x + Math.cos(rad) * 0.5, center.y + Math.sin(rad) * 0.5, 0
          ));
        }
        points.push(new THREE.Vector3(0.04, -0.12, 0), new THREE.Vector3(0, -0.34, 0));
        const curve = new THREE.CatmullRomCurve3(points);

        this.group = new THREE.Group();
        this.group.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 30, R, 6), this.material));
        for (const p of [points[0], points[points.length - 1]]) {
          const cap = new THREE.Mesh(new THREE.SphereGeometry(R, 6, 4), this.material);
          cap.position.copy(p);
          this.group.add(cap);
        }
        const dot = new THREE.Mesh(new THREE.IcosahedronGeometry(0.21, 0), this.material);
        dot.position.set(0, -0.82, 0);
        this.group.add(dot);

        this.group.rotation.set(0.1, -0.42, 0);
        this.group.position.y = -MODEL_BASE_OFFSET;
        this.scene.add(this.group);

        this.shadowMgr = new ShadowManager(
          container, () => this.group, this.camera
        );

        this.animate = this.animate.bind(this);
        this.renderer.setAnimationLoop(this.animate);
      }

      animate() {
        const dt = Math.min(this.clock.getDelta(), 0.05);
        this.applyColor(dt, this.material);
        this.applyLevit(this.group, dt);
        this.shadowMgr.update();
        this.renderer.render(this.scene, this.camera);
      }
    }

        const W = 1.15, H = 1.6, T_COVER = 0.055;
        const PAGES_W = 1.10, PAGES_H = 1.53, PAGES_T = 0.18;

        this.bookGroup = new THREE.Group();
        this.bookGroup.scale.setScalar(1.35);
        this.bookGroup.position.y = -MODEL_BASE_OFFSET;
        this.scene.add(this.bookGroup);

        this.baseRotX = 0.08;
        this.baseRotZ = -0.18;
        this.baseRotY = -0.55;
        this.openRotX = -1.15;
        this.openRotZ = 0.0;
        this.openRotY = 0.0;
        this.rotY = this.baseRotY;
        this.bookGroup.rotation.set(this.baseRotX, this.rotY, this.baseRotZ);

        this.coverMaterial = new THREE.MeshPhongMaterial({
          color: GRAY_BASE.clone(), shininess: 45, specular: 0x333333,
        });
        const pagesMaterial = new THREE.MeshPhongMaterial({ color: 0xf4ebdd, shininess: 6 });
        const pagesEdgeMaterial = new THREE.MeshPhongMaterial({ color: 0xe6dcc7, shininess: 4 });

        const spine = new THREE.Mesh(
          new THREE.BoxGeometry(T_COVER, H, PAGES_T + 2 * T_COVER), this.coverMaterial
        );
        spine.position.set(-W / 2 + T_COVER / 2, 0, 0);
        this.bookGroup.add(spine);

        const backCover = new THREE.Mesh(
          new THREE.BoxGeometry(W, H, T_COVER), this.coverMaterial
        );
        backCover.position.set(0, 0, -(PAGES_T / 2 + T_COVER / 2));
        this.bookGroup.add(backCover);

        const pages = new THREE.Mesh(
          new THREE.BoxGeometry(PAGES_W, PAGES_H, PAGES_T),
          [pagesEdgeMaterial, pagesMaterial, pagesMaterial,
           pagesMaterial, pagesMaterial, pagesMaterial]
        );
        this.bookGroup.add(pages);

        this.frontPivot = new THREE.Group();
        this.frontPivot.position.set(-W / 2, 0, PAGES_T / 2 + T_COVER / 2);
        this.bookGroup.add(this.frontPivot);

        const frontCover = new THREE.Mesh(
          new THREE.BoxGeometry(W, H, T_COVER), this.coverMaterial
        );
        frontCover.position.set(W / 2, 0, 0);
        this.frontPivot.add(frontCover);

        this.openProgress = 0;

        this.shadowMgr = new ShadowManager(
          container, () => this.bookGroup, this.camera
        );

        this.animate = this.animate.bind(this);
        this.renderer.setAnimationLoop(this.animate);
      }

      animate() {
        const dt = Math.min(this.clock.getDelta(), 0.05);
        const awake = this.isHovered || this.isSelected;
        const active = this.isSelected;

        this.applyColor(dt, this.coverMaterial, 0.28, 0.15);

        let targetRotY;
        if (active) targetRotY = this.openRotY;
        else if (awake) { this.rotY += dt * 1.1; targetRotY = this.rotY; }
        else targetRotY = this.baseRotY;

        let diffY = targetRotY - this.bookGroup.rotation.y;
        diffY = Math.atan2(Math.sin(diffY), Math.cos(diffY));
        this.bookGroup.rotation.y += diffY * Math.min(1, dt * 6);
        if (!active) this.rotY = this.bookGroup.rotation.y;

        const targetRotX = active ? this.openRotX : this.baseRotX;
        this.bookGroup.rotation.x += (targetRotX - this.bookGroup.rotation.x) * Math.min(1, dt * 5);

        const targetRotZ = active ? this.openRotZ : this.baseRotZ;
        this.bookGroup.rotation.z += (targetRotZ - this.bookGroup.rotation.z) * Math.min(1, dt * 5);

        const targetOpen = active ? 1 : 0;
        this.openProgress += (targetOpen - this.openProgress) * Math.min(1, dt * 4);
        this.frontPivot.rotation.y = -this.openProgress * (Math.PI * 0.72);

        this.applyLevit(this.bookGroup, dt);
        this.shadowMgr.update();

        this.renderer.render(this.scene, this.camera);
      }
    }

        const plankW = (W - 2 * T) / N_PLANKS;

          );

          new THREE.BoxGeometry(W, H_BASE, T), this.woodMaterial

          new THREE.SphereGeometry(R * 0.45, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2),

        this.treasure.position.set(0, -H_BASE / 2 + T * 1.5, 0);
        this.treasure.scale.y = 0.7;
        this.chestGroup.add(this.treasure);

        for (const x of [-W / 2 + T * 0.6, W / 2 - T * 0.6]) {
          const corner = new THREE.Mesh(
            new THREE.BoxGeometry(T * 1.3, H_BASE, T * 1.4), this.metalMaterial
          );
          corner.position.set(x, 0, frontZ + T * 0.15);
          this.chestGroup.add(corner);

        const lock = new THREE.Mesh(
          new THREE.BoxGeometry(0.28, 0.30, T * 1.4), this.metalMaterial
        );
        lock.position.set(0, H_BASE * 0.28, frontZ + T * 0.5);
        this.chestGroup.add(lock);

        const lockEye = new THREE.Mesh(
          new THREE.BoxGeometry(0.07, 0.10, T * 0.6),
          new THREE.MeshPhongMaterial({ color: 0x000000 })
        );
        lockEye.position.set(0, H_BASE * 0.28 - 0.02, frontZ + T * 0.9);
        this.chestGroup.add(lockEye);

        this.lidPivot = new THREE.Group();
        this.lidPivot.position.set(0, H_BASE / 2, -D / 2);
        this.chestGroup.add(this.lidPivot);

        const lidShape = new THREE.Shape();
        lidShape.moveTo(0, 0);
        lidShape.lineTo(D, 0);
        lidShape.absarc(D / 2, 0, R, Math.PI, 0, true);

        const lidGeo = new THREE.ExtrudeGeometry(lidShape, {
          depth: W, bevelEnabled: false, curveSegments: 28,
        });
        lidGeo.rotateY(-Math.PI / 2);
        lidGeo.translate(W / 2, 0, 0);
        this.lidPivot.add(new THREE.Mesh(lidGeo, this.woodMaterial));

        const strapBase = new THREE.Shape();
        strapBase.moveTo(-0.02, -0.01);
        strapBase.lineTo(D + 0.02, -0.01);
        strapBase.absarc(D / 2, 0, R + 0.02, Math.PI, 0, true);

        for (const xFrac of [-0.30, 0.30]) {
          const strapGeo = new THREE.ExtrudeGeometry(strapBase, {
            depth: 0.08, bevelEnabled: false, curveSegments: 28,

          strapGeo.translate(xFrac * W + 0.04, 0, 0);

        this.renderer.setAnimationLoop(this.animate);

        this.currentWood.lerp(woodTarget, Math.min(1, dt * 6));
        this.woodMaterial.color.copy(this.currentWood);

        const metalTarget = this.isUnlocked ? this.bronzeColor : GRAY_BASE;
        this.currentMetal.lerp(metalTarget, Math.min(1, dt * 6));
        this.metalMaterial.color.copy(this.currentMetal);

        let targetRotY;
        if (active) targetRotY = 0;
        else if (awake) { this.rotY += dt * 1.1; targetRotY = this.rotY; }
        else targetRotY = this.baseRotY;

        let diffY = targetRotY - this.chestGroup.rotation.y;
        diffY = Math.atan2(Math.sin(diffY), Math.cos(diffY));
        this.chestGroup.rotation.y += diffY * Math.min(1, dt * 6);
        if (!active) this.rotY = this.chestGroup.rotation.y;

        const targetRotX = active ? 0.10 : this.baseRotX;
        this.chestGroup.rotation.x += (targetRotX - this.chestGroup.rotation.x) * Math.min(1, dt * 5);

        const targetRotZ = active ? 0.0 : this.baseRotZ;
        this.chestGroup.rotation.z += (targetRotZ - this.chestGroup.rotation.z) * Math.min(1, dt * 5);

        const targetOpen = active ? 1 : 0;
        this.openProgress += (targetOpen - this.openProgress) * Math.min(1, dt * 4);
        this.lidPivot.rotation.x = -this.openProgress * (Math.PI * 0.55);

        this.applyLevit(this.chestGroup, dt);
        this.shadowMgr.update();

        this.renderer.render(this.scene, this.camera);
      }

    /* ============================================================
       PARTÍCULAS MÁGICAS
       ============================================================ */
    const PARTICLE_PALETTE = ['#D7B878', '#C7B3E5', '#ffffff'];

    function emitMagicParticles(originEl, colorHex) {
      if (reduceMotion) return;
      const rect = originEl.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height * 0.45;
      const particlesRoot = document.getElementById('magicParticles');
      const palette = [colorHex, ...PARTICLE_PALETTE];

      function spawn(className, sizeMin, sizeMax, vyBase, isSparkle, idx) {
        const el = document.createElement('div');
        el.className = className;
        const size = sizeMin + Math.random() * (sizeMax - sizeMin);
        el.style.width = size + 'px';
        el.style.height = size + 'px';
        el.style.left = (cx + (Math.random() - 0.5) * (isSparkle ? 70 : 40)) + 'px';
        el.style.top  = (cy + (Math.random() - 0.5) * (isSparkle ? 50 : 30)) + 'px';

        const color = palette[Math.floor(Math.random() * palette.length)];

        if (isSparkle) {
          el.innerHTML = `<svg viewBox="0 0 24 24" width="${size}" height="${size}">
            <path d="M12 2 L13.5 10.5 L22 12 L13.5 13.5 L12 22 L10.5 13.5 L2 12 L10.5 10.5 Z"
              fill="${color}" opacity="1"/></svg>`;
        } else {
          el.style.background = color;
          el.style.boxShadow = `0 0 ${6 + Math.random() * 8}px ${color}`;
          el.style.borderRadius = '50%';
        }
        particlesRoot.appendChild(el);

        const vx = (Math.random() - 0.5) * (isSparkle ? 120 : 180);
        const vy = -vyBase - Math.random() * (isSparkle ? 90 : 140);
        const gravity = isSparkle ? 320 : 380;
        const life = 0.8 + Math.random() * 0.6;
        const t0 = performance.now();
        const startX = parseFloat(el.style.left);
        const startY = parseFloat(el.style.top);

        function step(now) {
          const t = (now - t0) / 1000;
          if (t > life) { el.remove(); return; }
          const x = startX + vx * t;
          const y = startY + vy * t + 0.5 * gravity * t * t;
          const opacity = 1 - (t / life);
          const rot = isSparkle ? t * 240 * (idx % 2 === 0 ? 1 : -1) : 0;
          const scale = isSparkle ? 1 : 1 + t * 0.6;
          el.style.transform = `translate(${x - startX}px, ${y - startY}px) rotate(${rot}deg) scale(${scale})`;
          el.style.opacity = opacity;
          requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      }

      for (let i = 0; i < 22; i++) spawn('particle', 3, 9, 80, false, i);
      for (let i = 0; i < 8; i++) spawn('sparkle', 10, 20, 30, true, i);
    }

    /* ============================================================
       PARALLAX + CURSOR
       ============================================================ */
    const skyLayers = Array.from(document.querySelectorAll('.sky-layer, .sky-halo'));
    const cursorGlow = document.getElementById('cursorGlow');
    const cursorDot = document.getElementById('cursorDot');

    let mouseX = 0, mouseY = 0;          // -1..1 para parallax
    let rawX = window.innerWidth / 2;    // px para cursor
    let rawY = window.innerHeight / 2;
    let smoothX = 0, smoothY = 0;
    let parallaxBoost = 1;               // la inclinación mueve más el fondo que el mouse
    let cursorVisible = false;

    function updateMouse(clientX, clientY) {
      rawX = clientX;
      rawY = clientY;
      mouseX = (clientX / window.innerWidth) * 2 - 1;
      mouseY = (clientY / window.innerHeight) * 2 - 1;
      if (!cursorVisible) {
        cursorVisible = true;
        cursorGlow.classList.remove('hidden');
        cursorDot.classList.remove('hidden');
      }
    }

    // Solo el mouse real: un toque en el teléfono no debe mover el fondo
    document.addEventListener('pointermove', (e) => {
      if (e.pointerType !== 'touch') updateMouse(e.clientX, e.clientY);
    });

    document.addEventListener('mouseleave', () => {
      cursorVisible = false;
      cursorGlow.classList.add('hidden');
      cursorDot.classList.add('hidden');
    });

    // Al pasar por una card, el halo cambia a "hot"
    document.addEventListener('mouseover', (e) => {
      if (e.target.closest('.card')) cursorGlow.classList.add('hot');
      else cursorGlow.classList.remove('hot');
    });

    // Click: pulso del cursor + iluminar constelaciones cercanas
    document.addEventListener('mousedown', (e) => {
      cursorGlow.classList.remove('pulse');
      void cursorGlow.offsetWidth;
      cursorGlow.classList.add('pulse');
      lightStarsNear(e.clientX, e.clientY);
    });

    /* Loop principal: parallax + cursor suave */
    function tick() {
      if (!reduceMotion) {
        // Parallax con más fuerza
        smoothX += (mouseX - smoothX) * 0.12;
        smoothY += (mouseY - smoothY) * 0.12;
        skyLayers.forEach(layer => {
          const depth = parseFloat(layer.dataset.depth || '0.5');
          const px = -smoothX * 70 * depth * parallaxBoost;   // 👈 más marcado (antes 22)
          const py = -smoothY * 46 * depth * parallaxBoost;   // 👈 más marcado (antes 16)
          layer.style.setProperty('--px', `${px}px`);
          layer.style.setProperty('--py', `${py}px`);
        });
      }

      // Cursor: lerp suave para que el halo "siga" con inercia
      const glowRect = cursorGlow.getBoundingClientRect();
      const curGlowX = glowRect.left + glowRect.width / 2;
      const curGlowY = glowRect.top + glowRect.height / 2;
      const followX = curGlowX + (rawX - curGlowX) * 0.18;
      const followY = curGlowY + (rawY - curGlowY) * 0.18;

      cursorGlow.style.left = followX + 'px';
      cursorGlow.style.top  = followY + 'px';
      cursorDot.style.left  = rawX + 'px';
      cursorDot.style.top   = rawY + 'px';

      requestAnimationFrame(tick);
    }
    tick();

    /* Parallax por inclinación del teléfono */
    const TILT_RANGE = 14;       // grados de inclinación para llegar al máximo
    const TILT_BOOST = 1.6;
    const TILT_RECENTER_MS = 25000;   // qué tan lento vuelve al centro si mantienes la inclinación
    const clampUnit = (v) => Math.max(-1, Math.min(1, v));
    let tiltBase = null;
    let lastTiltTime = 0;

    function handleTilt(e) {
      if (e.beta === null || e.gamma === null) return;
      const angle = (screen.orientation ? screen.orientation.angle : window.orientation) || 0;
      let x = e.gamma, y = e.beta;
      if (angle === 90) { x = e.beta; y = -e.gamma; }
      else if (angle === 270 || angle === -90) { x = -e.beta; y = e.gamma; }
      else if (angle === 180) { x = -e.gamma; y = -e.beta; }

      if (!tiltBase) tiltBase = { x, y };
      parallaxBoost = TILT_BOOST;

      // La posición neutra sigue muy de a poco la postura de quien sostiene el teléfono
      const now = performance.now();
      const follow = 1 - Math.exp(-Math.min(now - lastTiltTime, 1000) / TILT_RECENTER_MS);
      lastTiltTime = now;
      tiltBase.x += (x - tiltBase.x) * follow;
      tiltBase.y += (y - tiltBase.y) * follow;
      mouseX = clampUnit((x - tiltBase.x) / TILT_RANGE);
      mouseY = clampUnit((y - tiltBase.y) / TILT_RANGE);
    }

    if (window.DeviceOrientationEvent && !reduceMotion) {
      window.addEventListener('deviceorientation', handleTilt);
      window.addEventListener('orientationchange', () => { tiltBase = null; });

      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        // iPhone solo entrega el movimiento si se pide permiso después de un toque
        const askTilt = () => {
          DeviceOrientationEvent.requestPermission().then(() => {
            document.removeEventListener('touchend', askTilt);
          }).catch(() => {});
        };
        document.addEventListener('touchend', askTilt);
      }
    }

    /* Iluminar estrellas cercanas al clic */
    function lightStarsNear(clientX, clientY) {
      const radius = 220; // px
      const stars = document.querySelectorAll('.star[data-clickable]');
      stars.forEach(star => {
        const rect = star.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dx = cx - clientX;
        const dy = cy - clientY;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < radius) {
          // Cuanto más cerca, más se ilumina
          const intensity = 1 - d / radius;
          star.classList.add('lit');
          // Ajuste proporcional con un pequeño delay para efecto cascada
          setTimeout(() => star.classList.remove('lit'), 500 + intensity * 400);
        }
      });
    }

    /* ============================================================
       CONSTRUCCIÓN DE CARDS
       ============================================================ */
    const cardsGrid = document.getElementById('cardsGrid');
    const cardEntries = [];
    const viewport = window.visualViewport;
    let globalMode = 0;

    const FALLBACK_GEM = `
      <svg class="model-fallback" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-linejoin="round" aria-hidden="true">
        <polygon points="20,4 32,14 27,32 13,32 8,14"/>
        <polyline points="8,14 20,18 32,14"/>
        <line x1="20" y1="18" x2="20" y2="4"/>
        <line x1="20" y1="18" x2="13" y2="32"/>
        <line x1="20" y1="18" x2="27" y2="32"/>
      </svg>`;
    const FALLBACK_QUESTION = `
      <svg class="model-fallback" viewBox="0 0 40 40" aria-hidden="true">
        <text x="20" y="31" text-anchor="middle" font-size="32" font-family="Cinzel, serif" fill="currentColor">?</text>
      </svg>`;

    function eachViewer(entry, fn) {
      [entry.mainViewer, entry.bookViewer, entry.chestViewer].forEach(v => { if (v) fn(v); });
    }

    function buildCard(data, index) {
      const el = document.createElement('div');
      el.className = data.inactive ? 'card card-inactive' : 'card';
      el.dataset.id = data.id;
      el.style.setProperty('--glow-color', data.color);
      el.style.setProperty('--glow-offset', '0px');

      el.innerHTML = `
        <div class="card-stage">
          <div class="card-shadow"></div>
          <div class="card-glow"></div>
          <div class="card-flash"></div>
          <div class="stage-content">
            <div class="slot slot-gem"></div>
            <div class="slot slot-book hidden"></div>
            <div class="slot slot-chest hidden"></div>
          </div>
          ${data.inactive ? '' : `
          <div class="code-panel">
            <div class="code-hint">Ingresa la clave</div>
            <div class="code-boxes">
              <input class="code-box" type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 1" />
              <input class="code-box" type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 2" />
              <input class="code-box" type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 3" />
              <input class="code-box" type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 4" />
            </div>
            <div class="code-msg">Código incorrecto</div>
          </div>`}
        </div>
        <div class="card-label">${data.name}</div>
        ${data.inactive ? '' : `
        <div class="card-content">
          <div class="card-content-inner">
            <div class="card-title"></div>
            <div class="card-desc"></div>
            ${data.buttons && data.buttons.length ? `
              <div class="card-actions">
                ${data.buttons.map(b => b.href
                  ? `<a class="card-btn" href="${b.href}" target="_blank" rel="noopener">${b.label}</a>`
                  : `<button type="button" class="card-btn"${b.video ? ' data-video="true"' : ''}>${b.label}</button>`
                ).join('')}
              </div>` : ''}
          </div>
        </div>`}
      `;

      cardsGrid.appendChild(el);

      if (!data.inactive) {
        el.querySelector('.card-title').textContent = data.title;
        el.querySelector('.card-desc').textContent = data.desc;
      }

      const stageEl = el.querySelector('.card-stage');
      const gemSlot = el.querySelector('.slot-gem');
      const bookSlot = el.querySelector('.slot-book');
      const chestSlot = el.querySelector('.slot-chest');

      el.querySelectorAll('.card-btn').forEach(b => {
        b.addEventListener('click', (e) => {
          e.stopPropagation();
          if (b.dataset.video) openVideo(`assets/${hashCode('video:' + entry.accessCode)}.mp4`, b);
        });
      });

      // Sin WebGL la página sigue funcionando, con un dibujo en lugar del modelo
      let mainViewer = null;
      try {
        mainViewer = data.inactive
          ? new QuestionViewer(gemSlot, data.color, index)
          : new GemViewer(gemSlot, data.color, data.shape, index);
      } catch (err) {
        gemSlot.innerHTML = data.inactive ? FALLBACK_QUESTION : FALLBACK_GEM;
        stageEl.style.setProperty('--shadow-y', `${stageEl.clientHeight * 0.84}px`);
      }

      const codePanel = el.querySelector('.code-panel');
      const codeBoxes = Array.from(el.querySelectorAll('.code-box'));
      const codeMsg = el.querySelector('.code-msg');

      const entry = {
        data, el, stageEl,
        descEl: el.querySelector('.card-desc'),
        titleEl: el.querySelector('.card-title'),
        labelEl: el.querySelector('.card-label'),
        mainViewer, bookViewer: null, chestViewer: null,
        gemSlot, bookSlot, chestSlot,
        codePanel, codeBoxes, codeMsg,
        unlocked: false,
        expectingCode: false,
        originalLabel: data.name,
      };
      cardEntries.push(entry);

      codeBoxes.forEach((box, i) => {
        box.addEventListener('input', () => {
          box.value = box.value.replace(/\D/g, '').slice(0, 1);
          if (box.value && i < codeBoxes.length - 1) codeBoxes[i + 1].focus({ preventScroll: true });
          if (codeBoxes.every(b => b.value.length === 1)) validateCode(entry);
        });
        box.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !box.value && i > 0) codeBoxes[i - 1].focus({ preventScroll: true });
          if (e.key === 'Enter') { e.preventDefault(); validateCode(entry); }
        });
      });

      if (!data.inactive) {
        el.addEventListener('mouseenter', () => eachViewer(entry, v => v.setHovered(true)));
        el.addEventListener('mouseleave', () => eachViewer(entry, v => v.setHovered(false)));
      }

      el.addEventListener('click', (e) => {
        // En el carrusel, tocar el modelo del costado solo lo trae al centro
        if (carouselQuery.matches && entry !== centeredEntry) { scrollToCard(entry); return; }
        if (data.inactive) return;
        if (codePanel.contains(e.target)) return;
        if (e.target.closest('.card-btn')) return;
        if (entry.expectingCode) return;
        if (!entry.unlocked) { openCodePanel(entry); return; }
        toggleSelect(entry);
      });

      return entry;
    }

    function openCodePanel(entry) {
      cardEntries.forEach(e => {
        if (e !== entry && e.expectingCode) closeCodePanel(e);
      });
      entry.expectingCode = true;
      entry.viewportBaseline = viewport ? viewport.height : 0;
      entry.codeBoxes.forEach(b => { b.value = ''; b.classList.remove('error'); });
      entry.codeMsg.classList.remove('show');
      entry.codePanel.classList.remove('fade-out');
      entry.codePanel.classList.add('open');
      entry.codeBoxes[0].focus({ preventScroll: true });
      keepCodePanelVisible();
    }

    function closeCodePanel(entry) {
      entry.expectingCode = false;
      entry.codePanel.classList.remove('open', 'shake', 'fade-out');
      entry.codePanel.style.removeProperty('--kb-shift');
      entry.codeBoxes.forEach(b => { b.classList.remove('error'); b.blur(); });
      entry.codeMsg.classList.remove('show');
      window.scrollTo(0, 0);
    }

    /* Si el teclado tapa la clave, solo sube el panel: la página no se mueve */
    function keepCodePanelVisible() {
      const entry = cardEntries.find(e => e.expectingCode);
      if (!entry || !viewport || entry.codePanel.classList.contains('fade-out')) return;
      const stage = entry.stageEl.getBoundingClientRect();
      const bottom = stage.top + stage.height / 2 + entry.codePanel.offsetHeight / 2;
      const shift = Math.max(0, bottom + 16 - (viewport.offsetTop + viewport.height));
      entry.codePanel.style.setProperty('--kb-shift', `${shift}px`);
    }
    if (viewport) viewport.addEventListener('resize', keepCodePanelVisible);

    /* Espera a que el teclado termine de cerrarse (o a que pase el tiempo máximo) */
    function whenKeyboardClosed(baseline, minMs = 380, maxMs = 1000) {
      return new Promise((resolve) => {
        const start = performance.now();
        const check = () => {
          const elapsed = performance.now() - start;
          const closed = !viewport || viewport.height >= baseline - 40;
          if (elapsed >= maxMs || (elapsed >= minMs && closed)) resolve();
          else requestAnimationFrame(check);
        };
        check();
      });
    }

    function validateCode(entry) {
      const value = entry.codeBoxes.map(b => b.value).join('');
      if (hashCode('objetos:' + value) === entry.data.codeHash) {
        entry.accessCode = value;
        // Primero se va el teclado; la animación parte con la página completa a la vista
        entry.codeBoxes.forEach(b => b.blur());
        entry.codePanel.classList.add('fade-out');
        whenKeyboardClosed(entry.viewportBaseline).then(() => {
          const stillOpen = entry.expectingCode;  // pudo cerrarse al deslizar o tocar fuera
          closeCodePanel(entry);
          entry.unlocked = true;
          eachViewer(entry, v => v.setUnlocked(true));
          if (stillOpen) toggleSelect(entry);
        });
      } else {
        entry.codePanel.classList.remove('shake');
        void entry.codePanel.offsetWidth;
        entry.codePanel.classList.add('shake');
        entry.codeBoxes.forEach(b => { b.classList.add('error'); b.value = ''; });
        entry.codeMsg.classList.add('show');
        entry.codeBoxes[0].focus({ preventScroll: true });
        setTimeout(() => {
          entry.codeBoxes.forEach(b => b.classList.remove('error'));
          entry.codeMsg.classList.remove('show');
        }, 1500);
      }
    }

    document.addEventListener('mousedown', (e) => {
      cardEntries.forEach(entry => {
        if (entry.expectingCode && !entry.codePanel.contains(e.target)) {
          closeCodePanel(entry);
        }
      });
    });

    function deselect(entry) {
      entry.el.classList.remove('selected');
      eachViewer(entry, v => v.setSelected(false));
    }

    function toggleSelect(entry) {
      const wasSelected = entry.el.classList.contains('selected');

      if (wasSelected) {
        deselect(entry);
        return;
      }

      cardEntries.forEach(e => {
        if (e !== entry && e.el.classList.contains('selected')) deselect(e);
      });

      entry.el.classList.add('selected');
      eachViewer(entry, v => v.setSelected(true));

      entry.el.classList.remove('flash');
      void entry.el.offsetWidth;
      entry.el.classList.add('flash');
      setTimeout(() => entry.el.classList.remove('flash'), 950);

      emitMagicParticles(entry.stageEl, entry.data.color);
    }

    /* ============================================================
       CARRUSEL MÓVIL
       ============================================================ */
    const carouselQuery = window.matchMedia('(max-width: 700px)');
    let centeredEntry = null;

    function scrollToCard(entry) {
      cardsGrid.scrollTo({
        left: entry.el.offsetLeft + entry.el.offsetWidth / 2 - cardsGrid.clientWidth / 2,
        behavior: reduceMotion ? 'auto' : 'smooth',
      });
    }

    function syncCarousel() {
      if (!carouselQuery.matches) {
        centeredEntry = null;
        cardEntries.forEach(e => {
          e.el.classList.remove('off-center');
          e.restoreOnReturn = false;
        });
        return;
      }
      const middle = cardsGrid.scrollLeft + cardsGrid.clientWidth / 2;
      const distance = (e) => Math.abs(e.el.offsetLeft + e.el.offsetWidth / 2 - middle);
      const nearest = cardEntries.reduce((a, b) => (distance(b) < distance(a) ? b : a));
      if (nearest === centeredEntry) return;

      // Al deslizar, la card que queda al costado se cierra, pero recuerda si estaba abierta
      if (centeredEntry) {
        centeredEntry.restoreOnReturn = centeredEntry.el.classList.contains('selected');
        deselect(centeredEntry);
        if (centeredEntry.expectingCode) closeCodePanel(centeredEntry);
        eachViewer(centeredEntry, v => v.setHovered(false));
      }
      centeredEntry = nearest;
      cardEntries.forEach(e => e.el.classList.toggle('off-center', e !== nearest));

      // Al volver se muestra tal como quedó, sin repetir el destello ni las partículas
      if (nearest.restoreOnReturn) {
        nearest.restoreOnReturn = false;
        nearest.el.classList.add('selected');
        eachViewer(nearest, v => v.setSelected(true, false));
      }
    }

    cardsGrid.addEventListener('scroll', () => {
      if (cardsGrid.scrollTop) cardsGrid.scrollTop = 0;   // el carrusel solo se mueve en horizontal
      syncCarousel();
    }, { passive: true });
    carouselQuery.addEventListener('change', syncCarousel);

    /* ============================================================
       REPRODUCTOR DE VIDEO
       ============================================================ */
    const SKIP_SECONDS = 10;
    const videoModal = document.getElementById('videoModal');
    const videoPlayer = document.getElementById('videoPlayer');
    const videoEl = document.getElementById('videoEl');
    const videoMsg = document.getElementById('videoMsg');
    const videoSeek = document.getElementById('videoSeek');
    const videoTime = document.getElementById('videoTime');
    const videoPlayBtn = document.getElementById('videoPlay');
    const videoCloseBtn = document.getElementById('videoClose');
    const socialLink = document.getElementById('socialLink');
    let videoOpener = null;

    const formatTime = (s) => {
      const total = Math.floor(s || 0);
      return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`;
    };
    const fullscreenElement = () => document.fullscreenElement || document.webkitFullscreenElement;

    function updateVideoProgress() {
      videoSeek.value = videoEl.currentTime;
      videoTime.textContent = `${formatTime(videoEl.currentTime)} / ${formatTime(videoEl.duration)}`;
    }

    // Los modelos 3D no necesitan dibujarse detrás del video
    function setViewersRunning(running) {
      cardEntries.forEach(e => eachViewer(e, v => {
        v.renderer.setAnimationLoop(running ? v.animate : null);
      }));
    }

    function openVideo(src, opener) {
      videoOpener = opener;
      videoMsg.hidden = true;
      videoEl.src = src;
      videoSeek.max = 0;
      updateVideoProgress();
      videoModal.hidden = false;
      cardsGrid.inert = true;
      socialLink.inert = true;
      setViewersRunning(false);
      videoCloseBtn.focus();
      videoEl.play().catch(() => {});     // si el navegador lo impide, queda el botón de reproducir
    }

    function closeVideo() {
      if (fullscreenElement()) toggleVideoFullscreen();
      videoEl.pause();
      videoEl.removeAttribute('src');
      videoEl.load();
      videoModal.hidden = true;
      cardsGrid.inert = false;
      socialLink.inert = false;
      setViewersRunning(true);
      if (videoOpener) videoOpener.focus();
    }

    function toggleVideoPlay() {
      if (videoEl.paused) videoEl.play().catch(() => {});
      else videoEl.pause();
    }

    function skipVideo(seconds) {
      const end = videoEl.duration || 0;
      videoEl.currentTime = Math.max(0, Math.min(end, videoEl.currentTime + seconds));
    }

    function toggleVideoFullscreen() {
      if (fullscreenElement()) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else if (videoPlayer.requestFullscreen) {
        videoPlayer.requestFullscreen();
      } else if (videoPlayer.webkitRequestFullscreen) {
        videoPlayer.webkitRequestFullscreen();
      } else if (videoEl.webkitEnterFullscreen) {
        videoEl.webkitEnterFullscreen();  // iPhone solo permite pantalla completa nativa
      }
    }

    // Salir de pantalla completa le quita el foco al botón que abrió el video
    document.addEventListener('fullscreenchange', () => {
      if (videoModal.hidden && videoOpener) videoOpener.focus();
    });

    videoEl.addEventListener('loadedmetadata', () => {
      videoSeek.max = videoEl.duration;
      updateVideoProgress();
    });
    videoEl.addEventListener('timeupdate', updateVideoProgress);
    videoEl.addEventListener('click', toggleVideoPlay);
    videoEl.addEventListener('error', () => {
      if (videoEl.getAttribute('src')) videoMsg.hidden = false;
    });
    videoEl.addEventListener('play', () => {
      videoPlayBtn.classList.remove('paused');
      videoPlayBtn.setAttribute('aria-label', 'Pausar');
    });
    videoEl.addEventListener('pause', () => {
      videoPlayBtn.classList.add('paused');
      videoPlayBtn.setAttribute('aria-label', 'Reproducir');
    });

    videoSeek.addEventListener('input', () => { videoEl.currentTime = videoSeek.value; });
    videoPlayBtn.addEventListener('click', toggleVideoPlay);
    document.getElementById('videoBack').addEventListener('click', () => skipVideo(-SKIP_SECONDS));
    document.getElementById('videoForward').addEventListener('click', () => skipVideo(SKIP_SECONDS));
    document.getElementById('videoFullscreen').addEventListener('click', toggleVideoFullscreen);
    videoCloseBtn.addEventListener('click', closeVideo);
    videoModal.addEventListener('click', (e) => { if (e.target === videoModal) closeVideo(); });

    document.addEventListener('keydown', (e) => {
      if (videoModal.hidden) return;
      if (e.key === 'Escape') closeVideo();
      else if (e.key === 'ArrowLeft') { e.preventDefault(); skipVideo(-SKIP_SECONDS); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); skipVideo(SKIP_SECONDS); }
      else if (e.key === ' ' && e.target.tagName !== 'BUTTON') { e.preventDefault(); toggleVideoPlay(); }
    });

    /* ============================================================
       CICLO DE MODELO
       (el botón está oculto; quita `hidden` de .top-controls para volver a usarlo)
       ============================================================ */
    const cycleBtn = document.getElementById('cycleModelBtn');
    const labelsByMode = ['Cambiar a libros', 'Cambiar a cofres', 'Cambiar a gemas'];
    cycleBtn.textContent = labelsByMode[0];

    cycleBtn.addEventListener('click', () => {
      globalMode = (globalMode + 1) % 3;
      cardEntries.forEach(e => {
        if (e.data.inactive) return;     // el signo ? no cambia de modelo
        if (e.el.classList.contains('selected')) deselect(e);
        e.gemSlot.classList.add('hidden');
        e.bookSlot.classList.add('hidden');
        e.chestSlot.classList.add('hidden');

        const idx = cardEntries.indexOf(e) + 1;
        if (globalMode === 0) {
          e.gemSlot.classList.remove('hidden');
          e.labelEl.textContent = e.originalLabel;
        } else if (globalMode === 1) {
          // Libro y cofre se crean solo si se piden, para no gastar WebGL en el teléfono
          if (!e.bookViewer) {
            e.bookViewer = new BookViewer(e.bookSlot, e.data.color, idx - 1);
            e.bookViewer.setUnlocked(e.unlocked);
          }
          e.bookSlot.classList.remove('hidden');
          e.labelEl.textContent = 'Libro ' + idx;
        } else {
          if (!e.chestViewer) {
            e.chestViewer = new ChestViewer(e.chestSlot, e.data.color, idx - 1);
            e.chestViewer.setUnlocked(e.unlocked);
          }
          e.chestSlot.classList.remove('hidden');
          e.labelEl.textContent = 'Cofre ' + idx;
        }
      });
      cycleBtn.textContent = labelsByMode[globalMode];
    });

    CARDS.forEach((c, i) => buildCard(c, i));
    syncCarousel();

    window.addEventListener('resize', () => {
      cardEntries.forEach(entry => {
        const stage = entry.stageEl;
        const w = stage.clientWidth;
        const h = stage.clientHeight;
        eachViewer(entry, v => {
          v.renderer.setSize(w, h);
          v.camera.aspect = w / h;
          v.camera.updateProjectionMatrix();
        });
      });
    });
  </script>
</body>
</html>
