<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Objetos Escondidos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       VARIABLES DE MARCA
       ============================================================ */
    :root {
      --midnight:   #17243D;
      --midnight-2: #1e2f4d;
      --gold:       #D7B878;
      --lavender:   #C7B3E5;
      --parchment:  #F4EBDD;

      --text-main:  #e8e3d8;
      --text-soft:  #b9b6c9;

      --font-heading: 'Cinzel', serif;
      --font-body:    'Nunito Sans', system-ui, sans-serif;

      --header-h: 80px;
      --stage-size: clamp(150px, 36vh, 220px);
      --pad-bottom: 24px;
      --content-reserve: 150px;   /* alto guardado para el texto y los botones */
      --app-h: 100vh;
      --sky-h: 100vh;
      /* Lienzo del fondo: como mínimo la capa (pantalla + 140px por lado), en proporción 3:2 */
      --sky-art-w: max(calc(100vw + 280px), calc((var(--sky-h) + 280px) * 1.5));
    }
    @supports (height: 100dvh) {
      :root { --app-h: 100dvh; }
    }
    @supports (height: 100lvh) {
      :root { --sky-h: 100lvh; }     /* el fondo no cambia con el teclado ni las barras del navegador */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* La página nunca se desplaza en vertical: todo vive dentro de la ventana */
    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: pan-x pinch-zoom;
    }
    html { background: var(--midnight-2); }

    body {
      position: fixed;
      inset: 0;
      color: var(--text-main);
      font-family: var(--font-body);
      cursor: none;               /* ocultamos el cursor nativo en desktop */
    }
    /* ...pero volvemos a mostrarlo en touch */
    @media (hover: none) {
      body { cursor: auto; }
    }

    /* ============================================================
       HALO DEL MOUSE
       ============================================================ */
    .cursor-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 140px;
      height: 140px;
      margin: -70px 0 0 -70px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 40;
      background: radial-gradient(circle,
        rgba(215,184,120,0.18) 0%,
        rgba(199,179,229,0.10) 35%,
        transparent 70%);
      transition: opacity 0.35s ease;
      will-change: transform;
    }
    .cursor-glow.hidden { opacity: 0; }
    .cursor-glow.hot {
      /* sobre una card */
      background: radial-gradient(circle,
        rgba(215,184,120,0.32) 0%,
        rgba(199,179,229,0.18) 35%,
        transparent 70%);
    }

    /* Punto central del cursor */
    .cursor-dot {
      position: fixed;
      top: 0;
      left: 0;
      width: 6px;
      height: 6px;
      margin: -3px 0 0 -3px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 10px rgba(215,184,120,0.8);
      pointer-events: none;
      z-index: 41;
      transition: opacity 0.35s ease;
      will-change: transform;
    }
    .cursor-dot.hidden { opacity: 0; }

    /* ============================================================
       FONDO PARALLAX
       ============================================================ */
    .sky {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--sky-h);
      background:
        radial-gradient(circle at 50% 0%, rgba(86,52,119,0.35) 0%, transparent 55%),
        radial-gradient(circle at 50% 100%, rgba(66,93,80,0.18) 0%, transparent 60%),
        linear-gradient(180deg, var(--midnight) 0%, var(--midnight-2) 100%);
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .sky-layer {
      position: absolute;
      inset: -140px;              /* mayor que el desplazamiento máximo: nunca se ve el borde */
      overflow: hidden;
      will-change: transform;
    }
    .sky-far   { opacity: 0.35; }
    .sky-mid   { opacity: 0.55; }
    .sky-near  { opacity: 0.78; }

    .sky-art {
      position: absolute;
      top: 50%;
      left: 50%;
      width: var(--sky-art-w);
      height: calc(var(--sky-art-w) / 1.5);
      margin-left: calc(var(--sky-art-w) / -2);
      margin-top: calc(var(--sky-art-w) / -3);
    }
    .sky-art svg { display: block; width: 100%; height: 100%; }

    .star {
      position: absolute;
      transform: translate(-50%, -50%);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .star-twinkle {
      border-radius: 50%;
      animation: twinkle 7s ease-in-out infinite;
    }
    .star-sparkle {
      clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.35; }
      50%      { opacity: 0.95; }
    }

    /* Estrella "iluminada" por el click */
    .star.lit {
      transform: translate(-50%, -50%) scale(1.9);
      box-shadow: 0 0 8px #fff, 0 0 14px var(--gold);
    }

    .sky-halo {
      position: absolute;
      top: 15%;
      left: 50%;
      margin-left: -450px;
      width: 900px;
      height: 900px;
      border-radius: 50%;
      background: radial-gradient(circle,
        rgba(215,184,120,0.10) 0%,
        rgba(215,184,120,0.04) 30%,
        transparent 65%);
      will-change: transform;
    }

    /* ============================================================
       HEADER
       ============================================================ */
    .brand-header {
      position: fixed;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: none;
      user-select: none;
      opacity: 0;
      animation: fadeDown 1s ease 0.2s forwards;
    }

    .brand-mark { width: 30px; height: 30px; flex-shrink: 0; }
    .brand-name {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 4px;
      text-transform: uppercase;
      white-space: nowrap;
      color: var(--gold);
      text-shadow: 0 0 18px rgba(215,184,120,0.25);
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translate(-50%, -8px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }

    /* Ícono de Instagram */
    .social-link {
      position: fixed;
      bottom: 6px;
      left: 50%;
      margin-left: -22px;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      color: var(--lavender);
      cursor: pointer;
      opacity: 0;
      animation: fadeIn 1s ease 0.4s forwards;
      transition: color 0.2s ease;
    }
    .social-link:hover { color: var(--gold); }
    .social-link:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: -4px;
      border-radius: 10px;
    }
    .social-link svg { width: 22px; height: 22px; }
    @keyframes fadeIn { to { opacity: 1; } }

    /* ============================================================
       GRID DE CARDS — CENTRADO REAL
       ============================================================ */
    .cards-grid {
      position: relative;
      z-index: 5;
      display: flex;
      gap: 3.5vw;
      justify-content: center;
      width: 100%;
      height: var(--app-h);              /* ocupa toda la ventana */
      padding: var(--header-h) 24px var(--pad-bottom);/* margen para el header */
      overflow: hidden;
    }

    /* ============================================================
       CARD
       ============================================================ */
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      /* El modelo tiene una posición fija: el espacio del texto queda siempre
         reservado, así activar o desactivar no mueve nada en la página. */
      padding-top: max(0px, calc((var(--app-h) - var(--header-h) - var(--pad-bottom)
                   - var(--stage-size) - 10px - var(--content-reserve)) / 2));
      cursor: pointer;
      position: relative;
      width: 320px;
      pointer-events: none;               /* solo el modelo y los botones reciben clics */
      opacity: 0;
      transform: translateY(14px);
      animation: cardIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .card:nth-child(1) { animation-delay: 0.55s; }
    .card:nth-child(2) { animation-delay: 0.70s; }
    .card.selected { z-index: 2; }
    .card-inactive { cursor: inherit; }
    .card-inactive:hover .stage-content { transform: none; }
    .card-inactive:hover .card-label { color: var(--text-soft); }

    @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }

    .card-stage {
      position: relative;
      flex: none;
      width: var(--stage-size);
      height: var(--stage-size);
      pointer-events: auto;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    /* Contenido bajo el modelo: solo aparece y desaparece, sin mover el modelo */
    .card-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
      visibility: hidden;
      transition: visibility 0s linear 0.5s;
    }
    .card.selected .card-content {
      visibility: visible;
      transition-delay: 0s;
    }

    .card-title {
      width: 100%;
      margin-top: 10px;
      text-align: center;
      font-family: var(--font-heading);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: 0.5px;
      color: var(--text-soft);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.5s ease, transform 0.5s ease, color 0.4s ease;
      user-select: none;
    }
    .card.selected .card-title {
      opacity: 1;
      transform: translateY(0);
      color: var(--glow-color);
      text-shadow: 0 0 20px color-mix(in srgb, var(--glow-color) 40%, transparent);
    }

    .card-desc {
      width: 100%;
      text-align: center;
      font-size: 13px;
      line-height: 1.55;
      color: var(--text-soft);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.5s ease 0.06s, transform 0.5s ease 0.06s, color 0.4s ease;
      user-select: none;
    }
    .card.selected .card-desc {
      opacity: 1;
      transform: translateY(0);
      color: var(--parchment);
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      padding: 4px;
    }

    .card-btn {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-soft);
      background: rgba(244,235,221,0.04);
      border: 1px solid rgba(199,179,229,0.18);
      border-radius: 999px;
      padding: 6px 14px;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      opacity: 0;
      transform: translateY(6px);
    }
    .card.selected .card-btn {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      color: var(--glow-color);
      border-color: color-mix(in srgb, var(--glow-color) 45%, transparent);
      background: color-mix(in srgb, var(--glow-color) 10%, transparent);
      transition: opacity 0.4s ease, transform 0.4s ease,
                  background 0.15s ease, color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .card.selected .card-btn:nth-child(1) { transition-delay: 0.30s, 0.30s, 0s, 0s, 0s, 0s; }
    .card.selected .card-btn:nth-child(2) { transition-delay: 0.40s, 0.40s, 0s, 0s, 0s, 0s; }

    .card.selected .card-btn:hover {
      background: color-mix(in srgb, var(--glow-color) 22%, transparent);
      border-color: color-mix(in srgb, var(--glow-color) 75%, transparent);
      color: #fff;
      box-shadow: 0 0 16px color-mix(in srgb, var(--glow-color) 35%, transparent);
    }
    .card-btn:active { transform: scale(0.96); }
    .card-btn:focus-visible {
      outline: 2px solid var(--glow-color);
      outline-offset: 2px;
    }

    /* Stage 3D interno */
    .stage-content {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      transition: transform 0.7s cubic-bezier(0.4, 0.0, 0.2, 1);
      will-change: transform;
    }
    .card:hover .stage-content { transform: translateY(-4px); }
    .card.selected .stage-content { transform: translateY(-6px); }

    .slot {
      position: absolute;
      inset: 0;
    }
    .slot canvas { display: block; }

    /* Dibujo de reemplazo si el dispositivo no puede mostrar el modelo 3D */
    .model-fallback {
      display: block;
      width: 62%;
      height: 62%;
      margin: 12% auto 0;
      color: var(--text-soft);
      transition: color 0.4s ease;
    }
    .card.selected .model-fallback { color: var(--glow-color); }

    .card-shadow {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translate(-50%, var(--shadow-y, 190px)) scale(var(--shadow-scale, 1));
      width: 90px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(6,10,20,0.65) 0%, transparent 70%);
      filter: blur(3px);
      pointer-events: none;
      opacity: 0.6;
      transition: opacity 0.35s ease;
      z-index: 0;
    }
    .card.selected .card-shadow { opacity: 0.5; }

    .card-glow {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translate(-50%, var(--shadow-y, 190px)) scale(1.1);
      width: 100px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(ellipse, var(--glow-color) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.5s ease;
      filter: blur(6px);
      pointer-events: none;
      z-index: 1;
    }
    .card.selected .card-glow {
      opacity: 0.7;
      animation: breathe 3.4s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.65; }
      50%      { opacity: 0.85; }
    }

    .card-flash {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff 0%, var(--glow-color) 40%, transparent 70%);
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      pointer-events: none;
      z-index: 2;
    }

    /* Label debajo del modelo */
    .card-label {
      position: relative;
      margin-top: -6px;                    /* justo debajo de la sombra del modelo */
      min-height: 16px;
      color: var(--text-soft);
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      transition: color 0.35s ease, text-shadow 0.35s ease;
      user-select: none;
      pointer-events: auto;
      z-index: 3;
      white-space: nowrap;
    }
    .card:hover .card-label { color: var(--lavender); }
    .card.selected .card-label {
      color: var(--glow-color);
      text-shadow: 0 0 14px var(--glow-color);
    }

    /* ============================================================
       CÓDIGO
       ============================================================ */
    .code-panel {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, calc(-46% - var(--kb-shift, 0px)));
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .code-panel.open {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, calc(-50% - var(--kb-shift, 0px)));
    }

    .code-hint {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 10.5px;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--lavender);
      text-shadow: 0 1px 6px rgba(0,0,0,0.7);
      user-select: none;
    }

    .code-boxes { display: flex; gap: 8px; }
    .code-box {
      width: 34px;
      height: 42px;
      font-size: 20px;
      font-weight: 600;
      color: var(--parchment);
      background: rgba(23, 36, 61, 0.92);
      border: 1px solid rgba(199,179,229,0.35);
      border-radius: 8px;
      outline: none;
      text-align: center;
      font-family: var(--font-body);
      caret-color: var(--gold);
      box-shadow: 0 4px 14px rgba(0,0,0,0.45);
      transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }
    .code-box:focus {
      border-color: var(--gold);
      background: rgba(30, 47, 77, 0.98);
      box-shadow: 0 0 12px rgba(215,184,120,0.35);
    }
    .code-box.error {
      border-color: #d96a6a;
      background: rgba(70, 20, 30, 0.9);
    }

    .code-msg {
      font-family: var(--font-body);
      font-size: 11px;
      color: #e08a8a;
      letter-spacing: 0.5px;
      height: 14px;
      opacity: 0;
      transition: opacity 0.25s ease;
      text-shadow: 0 1px 3px rgba(0,0,0,0.7);
    }
    .code-msg.show { opacity: 1; }

    @keyframes shakeLock {
      0%, 100% { transform: translateX(0); }
      15% { transform: translateX(-8px) rotate(-1.5deg); }
      30% { transform: translateX(7px) rotate(1.5deg); }
      45% { transform: translateX(-6px) rotate(-1deg); }
      60% { transform: translateX(5px) rotate(1deg); }
      75% { transform: translateX(-3px); }
      90% { transform: translateX(2px); }
    }
    .code-panel.shake .code-boxes,
    .code-panel.shake .code-hint {
      animation: shakeLock 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }

    .code-panel.fade-out {
      opacity: 0;
      transform: translate(-50%, calc(-60% - var(--kb-shift, 0px))) scale(0.9);
    }

    /* ============================================================
       REPRODUCTOR DE VIDEO
       ============================================================ */
    .video-modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(10, 16, 30, 0.94);
      cursor: default;                    /* el cursor propio queda detrás del modal */
    }
    .video-modal[hidden] { display: none; }

    .video-player {
      position: relative;
      display: flex;
      flex-direction: column;
      width: min(960px, 100%);
      background: #000;
      border: 1px solid rgba(199,179,229,0.25);
      border-radius: 12px;
      overflow: hidden;
    }
    .video-player video {
      display: block;
      width: 100%;
      max-height: calc(100vh - 124px);
      max-height: calc(100dvh - 124px);
      min-height: 180px;
      background: #000;
      cursor: pointer;
    }
    /* Reglas separadas: un navegador descarta la regla completa si no reconoce un selector */
    .video-player:fullscreen {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 0;
    }
    .video-player:-webkit-full-screen {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 0;
    }
    .video-player:fullscreen video {
      flex: 1;
      min-height: 0;
      max-height: none;
    }
    .video-player:-webkit-full-screen video {
      flex: 1;
      min-height: 0;
      max-height: none;
    }

    .video-btn.video-close {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
      background: rgba(23, 36, 61, 0.85);
    }

    .video-msg {
      position: absolute;
      top: 40%;
      left: 16px;
      right: 16px;
      text-align: center;
      font-size: 14px;
      color: var(--parchment);
    }

    .video-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px 12px;
      background: var(--midnight);
    }
    .video-seek {
      width: 100%;
      height: 20px;
      accent-color: var(--gold);
      cursor: pointer;
    }
    .video-buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .video-time {
      margin-right: auto;
      min-width: 84px;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: var(--text-soft);
    }
    .video-spacer { margin-left: auto; min-width: 84px; display: flex; justify-content: flex-end; }

    .video-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      height: 44px;
      padding: 0 8px;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 13px;
      color: var(--parchment);
      background: rgba(244,235,221,0.06);
      border: 1px solid rgba(199,179,229,0.3);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    @media (max-width: 420px) {
      .video-buttons { flex-wrap: wrap; }
      .video-time { flex: 0 0 100%; margin-right: 0; text-align: center; }
      .video-spacer { min-width: 0; }
      .video-player video {
        max-height: calc(100vh - 176px);
        max-height: calc(100dvh - 176px);
      }
    }
    .video-btn:hover { background: rgba(86,52,119,0.6); border-color: var(--gold); }
    .video-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .video-btn svg { width: 20px; height: 20px; fill: currentColor; }
    .video-btn .icon-play { display: none; }
    .video-btn.paused .icon-play { display: block; }
    .video-btn.paused .icon-pause { display: none; }

    /* ============================================================
       PARTÍCULAS
       ============================================================ */
    .magic-particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 45;
    }

    /* ============================================================
       ACCESIBILIDAD
       ============================================================ */
    @media (prefers-reduced-motion: reduce) {
      .card,
      .brand-header,
      .social-link { animation: none !important; opacity: 1 !important; transform: none !important; }
      .brand-header { transform: translateX(-50%) !important; }
      .star-twinkle { animation: none; opacity: 0.65; }
      .card.selected .card-glow { animation: none; }
      .stage-content { transition: none; }
      .cursor-glow { display: none; }
      .cursor-dot { display: none; }
      body { cursor: auto; }
    }

    @media (max-width: 900px) {
      body { cursor: auto; }
      .cursor-glow, .cursor-dot { display: none; }
      .brand-name { font-size: 13px; letter-spacing: 3px; }
    }

    /* Pantallas bajas (teléfono en horizontal) */
    @media (max-height: 520px) {
      :root {
        --header-h: 60px;
        --stage-size: clamp(110px, 30vh, 150px);
        --pad-bottom: 12px;
        --content-reserve: 144px;
      }
      .brand-header { top: 14px; }
      /* Con poca altura, el ícono pasa a la esquina para no tocar el contenido */
      .social-link { left: auto; right: 8px; margin-left: 0; }
    }

    /* Teléfono: carrusel horizontal con el modelo activo al centro */
    @media (max-width: 700px) {
      :root {
        --header-h: 64px;
        --stage-size: clamp(150px, 36vh, 240px);
        --pad-bottom: 16px;
        --content-reserve: 184px;
        --card-w: min(calc(100vw - 40px), 380px);
        --side-space: calc((100vw - var(--card-w)) / 2);
      }
      .cards-grid {
        justify-content: flex-start;
        gap: 0;
        padding: var(--header-h) 0 var(--pad-bottom) var(--side-space);
        overflow-x: auto;
        overflow-y: hidden;
        overscroll-behavior-x: contain;
        scroll-snap-type: x mandatory;
        scrollbar-width: none;
      }
      .cards-grid::-webkit-scrollbar { display: none; }
      .cards-grid::after {               /* permite centrar también la última card */
        content: '';
        flex: 0 0 var(--side-space);
      }
      .card {
        flex: 0 0 var(--card-w);
        scroll-snap-align: center;
        scroll-snap-stop: always;
      }
      /* Acerca la card vecina para que su modelo asome por el borde */
      .card + .card { margin-left: calc(50vw - 5px - var(--card-w)); }
      .card.off-center .card-stage { opacity: 0.8; transform: scale(0.88); }
      .card.off-center .card-label { opacity: 0; }
      /* Con una card abierta, el vecino se atenúa para no competir con el texto */
      .cards-grid:has(.card.selected) .card.off-center .card-stage { opacity: 0.35; }
      .card-content { width: min(100%, calc(100vw - 104px)); }
    }
    @media (max-width: 700px) and (max-height: 520px) {
      :root {
        --header-h: 52px;
        --stage-size: clamp(110px, 30vh, 150px);
        --pad-bottom: 12px;
        --content-reserve: 130px;
      }
    }
  </style>
</head>

  <script nomodule>
    document.getElementById('cardsGrid').innerHTML =
      '<p style="margin:auto;text-align:center">Actualiza tu navegador para ver esta página.</p>';
  </script>

  <script type="module">
    import * as THREE from './vendor/three.module.js';

    /* ============================================================
       DATOS DE LAS FICHAS
       ============================================================ */
    const socialLink = document.getElementById('socialLink');

    /* La clave no se guarda en el código: solo su huella, y la ruta del video se
       obtiene a partir de la clave. Con 4 dígitos esto oculta, pero no es seguridad real. */
    function hashCode(str) {
      let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
      for (let i = 0; i < str.length; i++) {
        const c = str.charCodeAt(i);
        h1 = Math.imul(h1 ^ c, 2654435761);
        h2 = Math.imul(h2 ^ c, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
    }

    const CARDS = [
      { id:'hiedra', name:'Hiedra Eterna', color:'#66bb6a', codeHash:'ae2204ccf4459',
        title:'Arma tu Hiedra Eterna',
        desc:'Un pequeño kit botánico para descubrir, crear y coleccionar. Cada pieza está pensada para armar algo tuyo.',
        buttons: [
          { label:'Tutorial', video:true },
          { label:'Instagram', href:socialLink.href },
        ] },
      { id:'misterio', name:'Próximamente', color:'#5a556b', inactive:true },
    ];

    /* ============================================================
       VISORES 3D
       ============================================================ */
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const MODEL_BASE_OFFSET = 0.35;
    const SHADOW_GAP_PX = 5;
    const GRAY_BASE = new THREE.Color(0x5a556b);
    // Colores reutilizados: crear objetos en cada cuadro provoca pausas de limpieza de memoria
    const emissiveTarget = new THREE.Color();

    class BaseViewer {
      constructor(container, index) {
        this.stageEl = container.closest('.card-stage');
        this.width = container.clientWidth;
        this.height = container.clientHeight;

        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.setSize(this.width, this.height);
        container.appendChild(this.renderer.domElement);

        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(45, this.width / this.height, 0.1, 100);
        this.camera.position.set(0, 0.05, 3.8);
        this.camera.lookAt(0, -0.35, 0);

        const key = new THREE.DirectionalLight(0xfff2d8, 2.0);
        key.position.set(3, 5, 4);
        this.scene.add(key);
        const rim = new THREE.DirectionalLight(0xb9a7dd, 1.3);
        rim.position.set(-4, -2, -3);
        this.scene.add(rim);
        this.scene.add(new THREE.AmbientLight(0xffffff, 0.7));

        this.levitAmp = reduceMotion ? 0 : 0.015 + index * 0.003;
        this.levitSpeed = 0.9 + index * 0.15;
        this.levitPhase = (index + 1) * 1.37 * Math.PI;
      }

      // Solo la gema reacciona; el resto de los modelos ignora estos estados
      setHovered() {}
      setSelected() {}
      setUnlocked() {}

      setModel(model) {
        this.model = model;
        model.position.y = -MODEL_BASE_OFFSET;
        this.scene.add(model);
        this.updateShadow();
      }

      // La sombra se calcula una vez (y al cambiar de tamaño), no en cada cuadro
      updateShadow() {
        this.camera.updateMatrixWorld();
        const box = new THREE.Box3().setFromObject(this.model);
        const bottom = new THREE.Vector3(0, box.min.y, 0).project(this.camera);
        const y = (1 - bottom.y) * 0.5 * this.height + SHADOW_GAP_PX;
        const scale = Math.max(0.55, Math.min(1.3, (box.max.x - box.min.x) / 1.3));
        this.stageEl.style.setProperty('--shadow-y', `${y}px`);
        this.stageEl.style.setProperty('--shadow-scale', `${scale}`);
      }

      resize(width, height) {
        if (width === this.width && height === this.height) return;
        this.width = width;
        this.height = height;
        this.renderer.setSize(width, height);
        this.camera.aspect = width / height;
        this.camera.updateProjectionMatrix();
        this.updateShadow();
      }

      applyLevit(time) {
        this.model.position.y = -MODEL_BASE_OFFSET
          + Math.sin(time * this.levitSpeed + this.levitPhase) * this.levitAmp;
      }

      render() {
        this.renderer.render(this.scene, this.camera);
      }
    }

    /* ------------------------------------------------------------
       Gema: se colorea al desbloquearla y gira al activarla
       ------------------------------------------------------------ */
    function buildGemGeometry() {
      const SIDES = 8;
      const ring = (y, radius) => {
        const points = [];
        for (let i = 0; i < SIDES; i++) {
          const a = (i / SIDES) * Math.PI * 2;
          points.push(new THREE.Vector3(Math.cos(a) * radius, y, Math.sin(a) * radius));
        }
        return points;
      };
      const rings = [ring(0.55, 0.85), ring(0.05, 1.0), ring(-0.55, 0.55)];
      const top = new THREE.Vector3(0, 1.0, 0);
      const tip = new THREE.Vector3(0, -1.1, 0);

      const positions = [];
      const triangle = (...points) => points.forEach(p => positions.push(p.x, p.y, p.z));
      for (let i = 0; i < SIDES; i++) {
        const next = (i + 1) % SIDES;
        triangle(top, rings[0][next], rings[0][i]);
        for (let r = 0; r < rings.length - 1; r++) {
          const upper = rings[r], lower = rings[r + 1];
          triangle(upper[i], upper[next], lower[i]);
          triangle(upper[next], lower[next], lower[i]);
        }
        triangle(tip, rings[rings.length - 1][i], rings[rings.length - 1][next]);
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.computeVertexNormals();
      return geometry;
    }

    class GemViewer extends BaseViewer {
      constructor(container, colorHex, index) {
        super(container, index);
        this.baseColor = new THREE.Color(colorHex);
        this.isHovered = false;
        this.isSelected = false;
        this.isUnlocked = false;
        this.rotY = 0;
        this.rotationSpeed = 0;
        this.flashTimer = 0;
        this.flashDuration = 0.9;

        this.material = new THREE.MeshPhongMaterial({
          color: GRAY_BASE.clone(), shininess: 120, specular: 0xffffff,
          emissive: 0x000000, flatShading: true, transparent: true, opacity: 0.9,
        });
        const mesh = new THREE.Mesh(buildGemGeometry(), this.material);
        mesh.rotation.x = 0.18;
        this.setModel(mesh);
      }

      setHovered(value) { this.isHovered = value; }
      setSelected(value, flash = true) {
        if (value && !this.isSelected && flash) this.flashTimer = this.flashDuration;
        this.isSelected = value;
      }
      setUnlocked(value) { this.isUnlocked = value; }

      update(dt, time, isOddFrame) {
        const awake = this.isHovered || this.isSelected;
        // Bloqueada y en reposo casi no cambia: basta con dibujarla un cuadro de cada dos
        if (!awake && !this.isUnlocked && isOddFrame) return;

        this.material.color.lerp(this.isUnlocked ? this.baseColor : GRAY_BASE, Math.min(1, dt * 6));

        let flashBoost = 0;
        if (this.flashTimer > 0) {
          this.flashTimer = Math.max(0, this.flashTimer - dt);
          flashBoost = Math.sin((1 - this.flashTimer / this.flashDuration) * Math.PI) * 1.8;
        }
        if (this.isUnlocked) {
          emissiveTarget.copy(this.baseColor).multiplyScalar(this.isSelected ? 0.28 : 0.15);
        } else if (awake) {
          emissiveTarget.setRGB(0.05, 0.04, 0.08);
        } else {
          emissiveTarget.setRGB(0, 0, 0);
        }
        emissiveTarget.r += flashBoost;
        emissiveTarget.g += flashBoost;
        emissiveTarget.b += flashBoost;
        this.material.emissive.lerp(emissiveTarget, Math.min(1, dt * 10));

        const targetOpacity = awake || this.isUnlocked ? 0.95 : 0.42;
        this.material.opacity += (targetOpacity - this.material.opacity) * Math.min(1, dt * 8);

        // Golpe de la explosión: la gema se infla un instante y vuelve a su tamaño
        const burst = 1 - this.flashTimer / this.flashDuration;
        const pop = reduceMotion || burst >= 0.45 ? 0 : Math.sin((burst / 0.45) * Math.PI) * 0.22;
        this.model.scale.setScalar(1 + pop);

        const targetSpeed = awake ? (this.isSelected ? 1.6 : 1.0) : (this.isUnlocked ? 0.3 : 0);
        this.rotationSpeed += (targetSpeed - this.rotationSpeed) * Math.min(1, dt * 5);
        this.rotY += this.rotationSpeed * dt;
        this.model.rotation.y = this.rotY;

        this.applyLevit(time);
        this.render();
      }
    }

    /* ------------------------------------------------------------
       Signo de interrogación: inactivo, gris y sin rotar
       ------------------------------------------------------------ */
    class QuestionViewer extends BaseViewer {
      constructor(container, index) {
        super(container, index);

        const material = new THREE.MeshPhongMaterial({
          color: GRAY_BASE.clone(), shininess: 60, specular: 0x555555, flatShading: true,
        });

        const R = 0.16;
        const points = [];
        for (let a = 170; a >= -60; a -= 23) {
          const rad = THREE.MathUtils.degToRad(a);
          points.push(new THREE.Vector3(Math.cos(rad) * 0.5, 0.52 + Math.sin(rad) * 0.5, 0));
        }
        points.push(new THREE.Vector3(0.04, -0.12, 0), new THREE.Vector3(0, -0.34, 0));

        const group = new THREE.Group();
        group.add(new THREE.Mesh(
          new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points), 30, R, 6), material
        ));
        for (const p of [points[0], points[points.length - 1]]) {
          const cap = new THREE.Mesh(new THREE.SphereGeometry(R, 6, 4), material);
          cap.position.copy(p);
          group.add(cap);
        }
        const dot = new THREE.Mesh(new THREE.IcosahedronGeometry(0.21, 0), material);
        dot.position.set(0, -0.82, 0);
        group.add(dot);
        group.rotation.set(0.1, -0.42, 0);
        this.setModel(group);
      }

      update(dt, time, isOddFrame) {
        if (isOddFrame) return;     // solo flota: basta con un cuadro de cada dos
        this.applyLevit(time);
        this.render();
      }
    }

    /* ============================================================
       PARTÍCULAS MÁGICAS
       ============================================================ */
    const PARTICLE_PALETTE = ['#D7B878', '#C7B3E5', '#ffffff'];

    const particlesCanvas = document.getElementById('magicParticles');
    const particlesCtx = particlesCanvas.getContext('2d');
    const spriteCache = {};
    let burstItems = [];

    // Brillos dibujados una sola vez por color: después solo se copian, muy rápido en el teléfono
    function getSprite(kind, color) {
      const key = kind + color;
      if (spriteCache[key]) return spriteCache[key];
      const S = 64, c = S / 2;
      const sprite = document.createElement('canvas');
      sprite.width = sprite.height = S;
      const g = sprite.getContext('2d');
      if (kind === 'glow') {
        const grad = g.createRadialGradient(c, c, 0, c, c, c);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.25, color);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = grad;
        g.fillRect(0, 0, S, S);
      } else {
        g.shadowColor = color;
        g.shadowBlur = 10;
        g.fillStyle = color;
        g.beginPath();
        for (let i = 0; i < 8; i++) {
          const r = i % 2 === 0 ? c * 0.8 : c * 0.12;
          const a = (i / 8) * Math.PI * 2;
          g.lineTo(c + Math.cos(a) * r, c + Math.sin(a) * r);
        }
        g.closePath();
        g.fill();
        g.fillStyle = '#ffffff';
        g.beginPath();
        g.arc(c, c, c * 0.1, 0, Math.PI * 2);
        g.fill();
      }
      spriteCache[key] = sprite;
      return sprite;
    }

    function drawSprite(sprite, x, y, size, alpha, rotation = 0) {
      particlesCtx.globalAlpha = alpha;
      if (rotation) {
        particlesCtx.save();
        particlesCtx.translate(x, y);
        particlesCtx.rotate(rotation);
        particlesCtx.drawImage(sprite, -size / 2, -size / 2, size, size);
        particlesCtx.restore();
      } else {
        particlesCtx.drawImage(sprite, x - size / 2, y - size / 2, size, size);
      }
    }

    function stepBurst(dt) {
      const ctx = particlesCtx;
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round';

      burstItems = burstItems.filter(p => (p.age += dt) < p.life);
      burstItems.forEach(p => {
        if (p.age < 0) return;
        const t = p.age / p.life;

        if (p.kind === 'flash') {
          drawSprite(p.sprite, p.x, p.y, p.size * (0.35 + 0.65 * (1 - Math.pow(1 - t, 3))), Math.pow(1 - t, 2));
          return;
        }
        if (p.kind === 'ring') {
          const r = p.size * (1 - Math.exp(-5 * p.age));
          const fade = Math.pow(1 - t, 2);
          const width = 1 + 4 * (1 - t);
          ctx.strokeStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
          ctx.globalAlpha = fade * 0.14;     // halo ancho y suave
          ctx.lineWidth = width * 6;
          ctx.stroke();
          ctx.globalAlpha = fade * 0.3;
          ctx.lineWidth = width * 2.5;
          ctx.stroke();
          ctx.globalAlpha = fade * 0.75;     // filo brillante
          ctx.lineWidth = width;
          ctx.stroke();
          return;
        }

        const damp = Math.exp(-p.drag * dt);
        p.vx *= damp;
        p.vy = p.vy * damp + p.gravity * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;

        let alpha = 1 - t;
        if (p.twinkle) alpha *= 0.55 + 0.45 * Math.sin(p.age * p.twinkle + p.phase);

        if (p.kind === 'spark') {          // chispa veloz con estela
          ctx.globalAlpha = alpha;
          ctx.strokeStyle = p.color;
          ctx.lineWidth = p.size * 0.16;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x - p.vx * 0.045, p.y - p.vy * 0.045);
          ctx.stroke();
        }
        p.rot += p.spin * dt;
        drawSprite(p.sprite, p.x, p.y, p.size, alpha, p.rot);
      });

      ctx.globalAlpha = 1;
      if (!burstItems.length) {
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        particlesCanvas.hidden = true;    // sin explosión, el lienzo no ocupa memoria gráfica
      }
    }

    function emitMagicParticles(originEl, colorHex) {
      if (reduceMotion) return;
      const rect = originEl.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height * 0.5;
      const palette = [colorHex, ...PARTICLE_PALETTE];
      const pick = () => palette[Math.floor(Math.random() * palette.length)];
      const rand = (min, max) => min + Math.random() * (max - min);

      const w = window.innerWidth, h = window.innerHeight;
      const small = Math.min(w, h) < 600;
      const reach = small ? 0.75 : 1;      // en el teléfono cubre la pantalla sin salirse tanto
      const amount = small ? 0.75 : 1;

      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      if (particlesCanvas.width !== Math.round(w * dpr) || particlesCanvas.height !== Math.round(h * dpr)) {
        particlesCanvas.width = Math.round(w * dpr);
        particlesCanvas.height = Math.round(h * dpr);
      }
      particlesCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // Fogonazo central y ondas expansivas
      burstItems.push({ kind:'flash', x:cx, y:cy, age:0, life:0.5,
        size: Math.min(Math.min(w, h) * 1.1, 760), sprite:getSprite('glow', colorHex) });
      [[0, colorHex], [0.08, '#ffffff'], [0.18, '#D7B878']].forEach(([delay, color]) => {
        burstItems.push({ kind:'ring', x:cx, y:cy, age:-delay, life:0.8,
          size: Math.min(Math.max(w, h) * 0.6, 620), color });
      });

      const launch = (kind, count, speedMin, speedMax, drag, gravity, lifeMin, lifeMax, sizeMin, sizeMax, shape, twinkle) => {
        for (let i = 0; i < Math.round(count * amount); i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = rand(speedMin, speedMax) * reach;
          const color = pick();
          burstItems.push({
            kind, x:cx, y:cy, age:-rand(0, 0.06), life:rand(lifeMin, lifeMax),
            vx:Math.cos(angle) * speed, vy:Math.sin(angle) * speed, drag, gravity,
            size:rand(sizeMin, sizeMax), color, sprite:getSprite(shape, color),
            rot:Math.random() * Math.PI, spin: shape === 'star' ? rand(-5, 5) : 0,
            twinkle: twinkle ? rand(10, 22) : 0, phase:Math.random() * Math.PI * 2,
          });
        }
      };
      launch('spark',  90, 420, 1250, 3.4, 150, 0.55, 1.2,  8, 18, 'glow', false);
      launch('star',   30, 180,  640, 2.6,  90, 0.9,  1.7, 14, 34, 'star', true);
      launch('glitter', 60,  40,  340, 1.8,  55, 1.3,  2.5,  4, 11, 'glow', true);

      particlesCanvas.hidden = false;
    }

    /* ============================================================
       FONDO: estrellas y constelaciones
       ============================================================ */
    // Coordenadas en un lienzo de 1200 × 800 que siempre cubre la pantalla
    const SKY_LAYERS = [
      { className:'sky-far', depth:0.35, color:'#C7B3E5',
        stars:[[80,200,0.9],[320,60,1],[700,120,0.8],[1080,180,1],[150,560,0.9],[520,680,1.1],[900,620,0.9],[1120,700,1],[420,380,0.8],[820,420,0.9]],
        line:{ width:0.35, opacity:0.15 },
        lines:['80,200 320,60 700,120', '520,680 900,620 1080,180'],
        sparkles:[], sparkleOpacity:0 },
      { className:'sky-mid', depth:0.7, color:'#C7B3E5',
        stars:[[220,140,1.3],[600,80,1.2],[980,220,1.4],[120,420,1.3],[760,540,1.2],[1050,640,1.3],[340,720,1.1]],
        line:{ width:0.5, opacity:0.2 },
        lines:['220,140 600,80 980,220', '120,420 220,140', '340,720 760,540 1050,640'],
        sparkles:[[600,311.5,23],[980,469,18]], sparkleOpacity:0.4 },
      { className:'sky-near', depth:1.1, color:'#F4EBDD',
        stars:[[180,300,1.6],[860,180,1.7],[480,520,1.5],[1080,420,1.6],[260,720,1.5]],
        line:{ width:0.7, opacity:0.28 },
        lines:['180,300 480,520 860,180', '1080,420 860,180'],
        sparkles:[[700,236.5,33]], sparkleOpacity:0.6 },
    ];

    function placeStar(art, x, y, sizeInLienzo, className, background) {
      const star = document.createElement('div');
      star.className = className;
      star.style.left = `${x / 12}%`;
      star.style.top = `${y / 8}%`;
      star.style.width = star.style.height = `calc(var(--sky-art-w) * ${sizeInLienzo / 1200})`;
      star.style.background = background;
      art.appendChild(star);
      return star;
    }

    function buildSky() {
      const sky = document.getElementById('sky');
      SKY_LAYERS.forEach(data => {
        const layer = document.createElement('div');
        layer.className = `sky-layer ${data.className}`;
        layer.dataset.depth = data.depth;
        layer.innerHTML = `
          <div class="sky-art">
            <svg viewBox="0 0 1200 800" stroke="#D7B878" stroke-width="${data.line.width}" fill="none" opacity="${data.line.opacity}">
              ${data.lines.map(points => `<polyline points="${points}"/>`).join('')}
            </svg>
          </div>`;
        const art = layer.firstElementChild;

        // Cada estrella es una capa propia: parpadea sin repintar el fondo completo
        data.stars.forEach(([x, y, r], i) => {
          const star = placeStar(art, x, y, r * 2, 'star star-twinkle', data.color);
          const n = i + 1;
          const [duration, delay] = n % 5 === 0 ? [13, 6] : n % 3 === 0 ? [11, 4] : n % 2 === 0 ? [9, 2] : [7, 0];
          star.style.animationDuration = `${duration}s`;
          star.style.animationDelay = `-${delay}s`;
        });
        data.sparkles.forEach(([x, y, size]) => {
          placeStar(art, x, y, size, 'star star-sparkle', '#D7B878').style.opacity = data.sparkleOpacity;
        });
        sky.appendChild(layer);
      });
    }
    buildSky();

    /* ============================================================
       PARALLAX + CURSOR
       ============================================================ */
    const PARALLAX_X = 70;      // px de la capa con profundidad 1
    const PARALLAX_Y = 46;
    const PARALLAX_EASE = 6;    // mayor = sigue más rápido
    const CURSOR_EASE = 12;

    const skyLayers = Array.from(document.querySelectorAll('.sky-layer, .sky-halo'))
      .map(el => ({ el, depth: parseFloat(el.dataset.depth) }));
    const skyStars = Array.from(document.querySelectorAll('.star'));
    const cursorGlow = document.getElementById('cursorGlow');
    const cursorDot = document.getElementById('cursorDot');

    let parallaxX = 0, parallaxY = 0;    // -1..1: hacia dónde apunta el mouse o la inclinación
    let smoothX = 0, smoothY = 0;
    let parallaxBoost = 1;               // la inclinación mueve más el fondo que el mouse
    let cursorX = 0, cursorY = 0;
    let glowX = 0, glowY = 0;
    let cursorVisible = false;

    // Solo el mouse real: un toque en el teléfono no debe mover el fondo
    document.addEventListener('pointermove', (e) => {
      if (e.pointerType === 'touch') return;
      cursorX = e.clientX;
      cursorY = e.clientY;
      parallaxX = (e.clientX / window.innerWidth) * 2 - 1;
      parallaxY = (e.clientY / window.innerHeight) * 2 - 1;
      if (!cursorVisible) {
        cursorVisible = true;
        glowX = cursorX;
        glowY = cursorY;
        cursorGlow.classList.remove('hidden');
        cursorDot.classList.remove('hidden');
      }
    });

    document.addEventListener('mouseleave', () => {
      cursorVisible = false;
      cursorGlow.classList.add('hidden');
      cursorDot.classList.add('hidden');
    });

    // Al pasar por una card, el halo cambia a "hot"
    document.addEventListener('mouseover', (e) => {
      cursorGlow.classList.toggle('hot', !!e.target.closest('.card'));
    });

    // Click: pulso del cursor + iluminar constelaciones cercanas
    document.addEventListener('mousedown', (e) => {
      if (cursorVisible && !reduceMotion) {
        cursorGlow.animate([{ scale: 1 }, { scale: 1.6 }, { scale: 1 }], { duration: 500, easing: 'ease-out' });
      }
      lightStarsNear(e.clientX, e.clientY);
    });

    function updateParallax(elapsed) {
      if (reduceMotion) return;
      const follow = 1 - Math.exp(-elapsed * PARALLAX_EASE);
      const stepX = (parallaxX - smoothX) * follow;
      const stepY = (parallaxY - smoothY) * follow;
      if (Math.abs(stepX) + Math.abs(stepY) < 0.0001) return;   // sin cambios no se toca el fondo
      smoothX += stepX;
      smoothY += stepY;
      const moveX = -smoothX * PARALLAX_X * parallaxBoost;
      const moveY = -smoothY * PARALLAX_Y * parallaxBoost;
      skyLayers.forEach(({ el, depth }) => {
        el.style.transform = `translate3d(${moveX * depth}px, ${moveY * depth}px, 0)`;
      });
    }

    function updateCursor(elapsed) {
      if (!cursorVisible) return;
      const follow = 1 - Math.exp(-elapsed * CURSOR_EASE);
      glowX += (cursorX - glowX) * follow;
      glowY += (cursorY - glowY) * follow;
      cursorGlow.style.transform = `translate3d(${glowX}px, ${glowY}px, 0)`;
      cursorDot.style.transform = `translate3d(${cursorX}px, ${cursorY}px, 0)`;
    }

    /* Parallax por inclinación del teléfono */
    const TILT_RANGE = 14;       // grados de inclinación para llegar al máximo
    const TILT_BOOST = 1.6;
    const TILT_RECENTER_MS = 25000;   // qué tan lento vuelve al centro si mantienes la inclinación
    const clampUnit = (v) => Math.max(-1, Math.min(1, v));
    let tiltBase = null;
    let lastTiltTime = 0;

    function handleTilt(e) {
      if (e.beta === null || e.gamma === null) return;
      const angle = (screen.orientation ? screen.orientation.angle : window.orientation) || 0;
      let x = e.gamma, y = e.beta;
      if (angle === 90) { x = e.beta; y = -e.gamma; }
      else if (angle === 270 || angle === -90) { x = -e.beta; y = e.gamma; }
      else if (angle === 180) { x = -e.gamma; y = -e.beta; }

      if (!tiltBase) tiltBase = { x, y };
      parallaxBoost = TILT_BOOST;

      // La posición neutra sigue muy de a poco la postura de quien sostiene el teléfono
      const now = performance.now();
      const follow = 1 - Math.exp(-Math.min(now - lastTiltTime, 1000) / TILT_RECENTER_MS);
      lastTiltTime = now;
      tiltBase.x += (x - tiltBase.x) * follow;
      tiltBase.y += (y - tiltBase.y) * follow;
      parallaxX = clampUnit((x - tiltBase.x) / TILT_RANGE);
      parallaxY = clampUnit((y - tiltBase.y) / TILT_RANGE);
    }

    if (window.DeviceOrientationEvent && !reduceMotion) {
      window.addEventListener('deviceorientation', handleTilt);
      window.addEventListener('orientationchange', () => { tiltBase = null; });

      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        // iPhone solo entrega el movimiento si se pide permiso después de un toque
        const askTilt = () => {
          DeviceOrientationEvent.requestPermission().then(() => {
            document.removeEventListener('touchend', askTilt);
          }).catch(() => {});
        };
        document.addEventListener('touchend', askTilt);
      }
    }

    /* Iluminar estrellas cercanas al clic: cuanto más cerca, más dura */
    function lightStarsNear(clientX, clientY) {
      const radius = 220; // px
      skyStars.forEach(star => {
        const rect = star.getBoundingClientRect();
        const d = Math.hypot(rect.left + rect.width / 2 - clientX, rect.top + rect.height / 2 - clientY);
        if (d < radius) {
          star.classList.add('lit');
          setTimeout(() => star.classList.remove('lit'), 500 + (1 - d / radius) * 400);
        }
      });
    }

    /* ============================================================
       CONSTRUCCIÓN DE CARDS
       ============================================================ */
    const cardsGrid = document.getElementById('cardsGrid');
    const cardEntries = [];
    const viewport = window.visualViewport;

    const FALLBACK_GEM = `
      <svg class="model-fallback" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-linejoin="round" aria-hidden="true">
        <polygon points="20,4 32,14 27,32 13,32 8,14"/>
        <polyline points="8,14 20,18 32,14"/>
        <line x1="20" y1="18" x2="20" y2="4"/>
        <line x1="20" y1="18" x2="13" y2="32"/>
        <line x1="20" y1="18" x2="27" y2="32"/>
      </svg>`;
    const FALLBACK_QUESTION = `
      <svg class="model-fallback" viewBox="0 0 40 40" aria-hidden="true">
        <text x="20" y="31" text-anchor="middle" font-size="32" font-family="Cinzel, serif" fill="currentColor">?</text>
      </svg>`;

    function buildCard(data, index) {
      const el = document.createElement('div');
      el.className = data.inactive ? 'card card-inactive' : 'card';
      el.dataset.id = data.id;
      el.style.setProperty('--glow-color', data.color);

      el.innerHTML = `
        <div class="card-stage">
          <div class="card-shadow"></div>
          <div class="card-glow"></div>
          <div class="card-flash"></div>
          <div class="stage-content">
            <div class="slot"></div>
          </div>
          ${data.inactive ? '' : `
          <div class="code-panel">
            <div class="code-hint">Ingresa la clave</div>
            <div class="code-boxes">
              <input class="code-box" type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 1" />
              <input class="code-box" type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 2" />
              <input class="code-box" type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 3" />
              <input class="code-box" type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 4" />
            </div>
            <div class="code-msg">Código incorrecto</div>
          </div>`}
        </div>
        <div class="card-label">${data.name}</div>
        ${data.inactive ? '' : `
        <div class="card-content">
          <div class="card-title"></div>
          <div class="card-desc"></div>
          <div class="card-actions">
            ${data.buttons.map(b => b.href
              ? `<a class="card-btn" href="${b.href}" target="_blank" rel="noopener">${b.label}</a>`
              : `<button type="button" class="card-btn"${b.video ? ' data-video="true"' : ''}>${b.label}</button>`
            ).join('')}
          </div>
        </div>`}
      `;

      cardsGrid.appendChild(el);

      if (!data.inactive) {
        el.querySelector('.card-title').textContent = data.title;
        el.querySelector('.card-desc').textContent = data.desc;
      }

      const stageEl = el.querySelector('.card-stage');
      const slot = el.querySelector('.slot');

      el.querySelectorAll('.card-btn').forEach(b => {
        b.addEventListener('click', (e) => {
          e.stopPropagation();
          if (b.dataset.video) openVideo(`assets/${hashCode('video:' + entry.accessCode)}.mp4`, b);
        });
      });

      // Sin WebGL la página sigue funcionando, con un dibujo en lugar del modelo
      let viewer = null;
      try {
        viewer = data.inactive
          ? new QuestionViewer(slot, index)
          : new GemViewer(slot, data.color, index);
      } catch (err) {
        slot.innerHTML = data.inactive ? FALLBACK_QUESTION : FALLBACK_GEM;
        stageEl.style.setProperty('--shadow-y', `${stageEl.clientHeight * 0.84}px`);
      }

      const codePanel = el.querySelector('.code-panel');
      const codeBoxes = Array.from(el.querySelectorAll('.code-box'));
      const codeMsg = el.querySelector('.code-msg');

      const entry = {
        data, el, stageEl, viewer,
        codePanel, codeBoxes, codeMsg,
        unlocked: false,
        expectingCode: false,
      };
      cardEntries.push(entry);

      codeBoxes.forEach((box, i) => {
        box.addEventListener('input', () => {
          box.value = box.value.replace(/\D/g, '').slice(0, 1);
          if (box.value && i < codeBoxes.length - 1) codeBoxes[i + 1].focus({ preventScroll: true });
          if (codeBoxes.every(b => b.value.length === 1)) validateCode(entry);
        });
        box.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !box.value && i > 0) codeBoxes[i - 1].focus({ preventScroll: true });
          if (e.key === 'Enter') { e.preventDefault(); validateCode(entry); }
        });
      });

      if (viewer) {
        el.addEventListener('mouseenter', () => viewer.setHovered(true));
        el.addEventListener('mouseleave', () => viewer.setHovered(false));
      }

      el.addEventListener('click', (e) => {
        // En el carrusel, tocar el modelo del costado solo lo trae al centro
        if (carouselQuery.matches && entry !== centeredEntry) { scrollToCard(entry); return; }
        if (data.inactive) return;
        if (codePanel.contains(e.target)) return;
        if (entry.expectingCode) return;
        if (!entry.unlocked) { openCodePanel(entry); return; }
        toggleSelect(entry);
      });

    }

    function openCodePanel(entry) {
      cardEntries.forEach(e => {
        if (e !== entry && e.expectingCode) closeCodePanel(e);
      });
      entry.expectingCode = true;
      entry.viewportBaseline = viewport ? viewport.height : 0;
      entry.codeBoxes.forEach(b => { b.value = ''; b.classList.remove('error'); });
      entry.codeMsg.classList.remove('show');
      entry.codePanel.classList.remove('fade-out');
      entry.codePanel.classList.add('open');
      entry.codeBoxes[0].focus({ preventScroll: true });
      keepCodePanelVisible();
    }

    function closeCodePanel(entry) {
      entry.expectingCode = false;
      entry.codePanel.classList.remove('open', 'shake', 'fade-out');
      entry.codePanel.style.removeProperty('--kb-shift');
      entry.codeBoxes.forEach(b => { b.classList.remove('error'); b.blur(); });
      entry.codeMsg.classList.remove('show');
      window.scrollTo(0, 0);
    }

    /* Si el teclado tapa la clave, solo sube el panel: la página no se mueve */
    function keepCodePanelVisible() {
      const entry = cardEntries.find(e => e.expectingCode);
      if (!entry || !viewport || entry.codePanel.classList.contains('fade-out')) return;
      const stage = entry.stageEl.getBoundingClientRect();
      const bottom = stage.top + stage.height / 2 + entry.codePanel.offsetHeight / 2;
      const shift = Math.max(0, bottom + 16 - (viewport.offsetTop + viewport.height));
      entry.codePanel.style.setProperty('--kb-shift', `${shift}px`);
    }
    if (viewport) viewport.addEventListener('resize', keepCodePanelVisible);

    /* Espera a que el teclado termine de cerrarse (o a que pase el tiempo máximo) */
    function whenKeyboardClosed(baseline, minMs = 380, maxMs = 1000) {
      return new Promise((resolve) => {
        const start = performance.now();
        const check = () => {
          const elapsed = performance.now() - start;
          const closed = !viewport || viewport.height >= baseline - 40;
          if (elapsed >= maxMs || (elapsed >= minMs && closed)) resolve();
          else requestAnimationFrame(check);
        };
        check();
      });
    }

    function validateCode(entry) {
      const value = entry.codeBoxes.map(b => b.value).join('');
      if (hashCode('objetos:' + value) === entry.data.codeHash) {
        entry.accessCode = value;
        // Primero se va el teclado; la animación parte con la página completa a la vista
        entry.codeBoxes.forEach(b => b.blur());
        entry.codePanel.classList.add('fade-out');
        whenKeyboardClosed(entry.viewportBaseline).then(() => {
          const stillOpen = entry.expectingCode;  // pudo cerrarse al deslizar o tocar fuera
          closeCodePanel(entry);
          entry.unlocked = true;
          if (entry.viewer) entry.viewer.setUnlocked(true);
          if (stillOpen) toggleSelect(entry);
        });
      } else {
        entry.codePanel.classList.remove('shake');
        void entry.codePanel.offsetWidth;
        entry.codePanel.classList.add('shake');
        entry.codeBoxes.forEach(b => { b.classList.add('error'); b.value = ''; });
        entry.codeMsg.classList.add('show');
        entry.codeBoxes[0].focus({ preventScroll: true });
        setTimeout(() => {
          entry.codeBoxes.forEach(b => b.classList.remove('error'));
          entry.codeMsg.classList.remove('show');
        }, 1500);
      }
    }

    document.addEventListener('mousedown', (e) => {
      cardEntries.forEach(entry => {
        if (entry.expectingCode && !entry.codePanel.contains(e.target)) {
          closeCodePanel(entry);
        }
      });
    });

    function deselect(entry) {
      entry.el.classList.remove('selected');
      if (entry.viewer) entry.viewer.setSelected(false);
    }

    function toggleSelect(entry) {
      const wasSelected = entry.el.classList.contains('selected');

      if (wasSelected) {
        deselect(entry);
        return;
      }

      cardEntries.forEach(e => {
        if (e !== entry && e.el.classList.contains('selected')) deselect(e);
      });

      entry.el.classList.add('selected');
      if (entry.viewer) entry.viewer.setSelected(true);

      if (!reduceMotion) {
        entry.el.querySelector('.card-flash').animate([
          { transform: 'translate(-50%, -50%) scale(0.2)', opacity: 0 },
          { opacity: 0.95, offset: 0.25 },
          { transform: 'translate(-50%, -50%) scale(7)', opacity: 0 },
        ], { duration: 900, easing: 'ease-out' });
      }

      emitMagicParticles(entry.stageEl, entry.data.color);
    }

    /* ============================================================
       CARRUSEL MÓVIL
       ============================================================ */
    const carouselQuery = window.matchMedia('(max-width: 700px)');
    let centeredEntry = null;

    function scrollToCard(entry) {
      cardsGrid.scrollTo({
        left: entry.el.offsetLeft + entry.el.offsetWidth / 2 - cardsGrid.clientWidth / 2,
        behavior: reduceMotion ? 'auto' : 'smooth',
      });
    }

    function syncCarousel() {
      if (!carouselQuery.matches) {
        centeredEntry = null;
        cardEntries.forEach(e => {
          e.el.classList.remove('off-center');
          e.restoreOnReturn = false;
        });
        return;
      }
      const middle = cardsGrid.scrollLeft + cardsGrid.clientWidth / 2;
      const distance = (e) => Math.abs(e.el.offsetLeft + e.el.offsetWidth / 2 - middle);
      const nearest = cardEntries.reduce((a, b) => (distance(b) < distance(a) ? b : a));
      if (nearest === centeredEntry) return;

      // Al deslizar, la card que queda al costado se cierra, pero recuerda si estaba abierta
      if (centeredEntry) {
        centeredEntry.restoreOnReturn = centeredEntry.el.classList.contains('selected');
        deselect(centeredEntry);
        if (centeredEntry.expectingCode) closeCodePanel(centeredEntry);
        if (centeredEntry.viewer) centeredEntry.viewer.setHovered(false);
      }
      centeredEntry = nearest;
      cardEntries.forEach(e => e.el.classList.toggle('off-center', e !== nearest));

      // Al volver se muestra tal como quedó, sin repetir el destello ni las partículas
      if (nearest.restoreOnReturn) {
        nearest.restoreOnReturn = false;
        nearest.el.classList.add('selected');
        if (nearest.viewer) nearest.viewer.setSelected(true, false);
      }
    }

    cardsGrid.addEventListener('scroll', () => {
      if (cardsGrid.scrollTop) cardsGrid.scrollTop = 0;   // el carrusel solo se mueve en horizontal
      syncCarousel();
    }, { passive: true });
    carouselQuery.addEventListener('change', syncCarousel);

    /* ============================================================
       REPRODUCTOR DE VIDEO
       ============================================================ */
    const SKIP_SECONDS = 10;
    const videoModal = document.getElementById('videoModal');
    const videoPlayer = document.getElementById('videoPlayer');
    const videoEl = document.getElementById('videoEl');
    const videoMsg = document.getElementById('videoMsg');
    const videoSeek = document.getElementById('videoSeek');
    const videoTime = document.getElementById('videoTime');
    const videoPlayBtn = document.getElementById('videoPlay');
    const videoCloseBtn = document.getElementById('videoClose');
    let videoOpener = null;

    const formatTime = (s) => {
      const total = Math.floor(s || 0);
      return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`;
    };
    const fullscreenElement = () => document.fullscreenElement || document.webkitFullscreenElement;

    function updateVideoProgress() {
      videoSeek.value = videoEl.currentTime;
      videoTime.textContent = `${formatTime(videoEl.currentTime)} / ${formatTime(videoEl.duration)}`;
    }

    function openVideo(src, opener) {
      videoOpener = opener;
      videoMsg.hidden = true;
      videoEl.src = src;
      videoSeek.max = 0;
      updateVideoProgress();
      videoModal.hidden = false;
      cardsGrid.inert = true;
      socialLink.inert = true;
      videoCloseBtn.focus();
      videoEl.play().catch(() => {});     // si el navegador lo impide, queda el botón de reproducir
    }

    function closeVideo() {
      if (fullscreenElement()) toggleVideoFullscreen();
      videoEl.pause();
      videoEl.removeAttribute('src');
      videoEl.load();
      videoModal.hidden = true;
      cardsGrid.inert = false;
      socialLink.inert = false;
      if (videoOpener) videoOpener.focus();
    }

    function toggleVideoPlay() {
      if (videoEl.paused) videoEl.play().catch(() => {});
      else videoEl.pause();
    }

    function skipVideo(seconds) {
      const end = videoEl.duration || 0;
      videoEl.currentTime = Math.max(0, Math.min(end, videoEl.currentTime + seconds));
    }

    function toggleVideoFullscreen() {
      if (fullscreenElement()) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else if (videoPlayer.requestFullscreen) {
        videoPlayer.requestFullscreen();
      } else if (videoPlayer.webkitRequestFullscreen) {
        videoPlayer.webkitRequestFullscreen();
      } else if (videoEl.webkitEnterFullscreen) {
        videoEl.webkitEnterFullscreen();  // iPhone solo permite pantalla completa nativa
      }
    }

    // Salir de pantalla completa le quita el foco al botón que abrió el video
    document.addEventListener('fullscreenchange', () => {
      if (videoModal.hidden && videoOpener) videoOpener.focus();
    });

    videoEl.addEventListener('loadedmetadata', () => {
      videoSeek.max = videoEl.duration;
      updateVideoProgress();
    });
    videoEl.addEventListener('timeupdate', updateVideoProgress);
    videoEl.addEventListener('click', toggleVideoPlay);
    videoEl.addEventListener('error', () => {
      if (videoEl.getAttribute('src')) videoMsg.hidden = false;
    });
    videoEl.addEventListener('play', () => {
      videoPlayBtn.classList.remove('paused');
      videoPlayBtn.setAttribute('aria-label', 'Pausar');
    });
    videoEl.addEventListener('pause', () => {
      videoPlayBtn.classList.add('paused');
      videoPlayBtn.setAttribute('aria-label', 'Reproducir');
    });

    videoSeek.addEventListener('input', () => { videoEl.currentTime = videoSeek.value; });
    videoPlayBtn.addEventListener('click', toggleVideoPlay);
    document.getElementById('videoBack').addEventListener('click', () => skipVideo(-SKIP_SECONDS));
    document.getElementById('videoForward').addEventListener('click', () => skipVideo(SKIP_SECONDS));
    document.getElementById('videoFullscreen').addEventListener('click', toggleVideoFullscreen);
    videoCloseBtn.addEventListener('click', closeVideo);
    videoModal.addEventListener('click', (e) => { if (e.target === videoModal) closeVideo(); });

    document.addEventListener('keydown', (e) => {
      if (videoModal.hidden) return;
      if (e.key === 'Escape') closeVideo();
      else if (e.key === 'ArrowLeft') { e.preventDefault(); skipVideo(-SKIP_SECONDS); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); skipVideo(SKIP_SECONDS); }
      else if (e.key === ' ' && e.target.tagName !== 'BUTTON') { e.preventDefault(); toggleVideoPlay(); }
    });

    /* ============================================================
       INICIO Y BUCLE ÚNICO DE ANIMACIÓN
       ============================================================ */
    CARDS.forEach(buildCard);
    syncCarousel();

    window.addEventListener('resize', () => {
      cardEntries.forEach(({ viewer, stageEl }) => {
        if (viewer) viewer.resize(stageEl.clientWidth, stageEl.clientHeight);
      });
    });

    // Todo se actualiza aquí, una vez por cuadro. Solo se escribe `transform` en el
    // fondo y el cursor, para no forzar recálculos de estilo ni de diseño.
    let lastFrameTime = performance.now();
    let frameCount = 0;

    function frame(now) {
      requestAnimationFrame(frame);
      const elapsed = Math.max(0, (now - lastFrameTime) / 1000);
      lastFrameTime = now;
      if (!videoModal.hidden) return;   // nada necesita dibujarse detrás del video

      frameCount++;
      updateParallax(elapsed);
      updateCursor(elapsed);

      const dt = Math.min(elapsed, 0.05);
      const isOddFrame = frameCount % 2 === 1;
      cardEntries.forEach(({ viewer }) => {
        if (viewer) viewer.update(dt, now * 0.001, isOddFrame);
      });

      if (burstItems.length) stepBurst(Math.min(elapsed, 0.1));
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
